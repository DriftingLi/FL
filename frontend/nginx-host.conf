# ===== 前端 Nginx 配置（host 网络模式，用于 PVE 环境） =====
# 适用场景：PVE 宿主机 iptables FORWARD policy DROP 导致 Docker 网桥外部访问不通
# 解决方案：frontend 用 network_mode: host，nginx 直接监听宿主机 51820 端口
#           backend 端口映射到 127.0.0.1:8080，nginx 通过回环地址反代
# 挂载路径：/etc/nginx/conf.d/default.conf.template

# ===== dify.gccsmile.com: 转发到内网 Dify 服务（LXC 172.17.1.40:80） =====
server {
    listen 51820;
    server_name dify.gccsmile.com;

    client_max_body_size 250M;

    # Dify 大量使用 SSE 流式响应，需关闭缓冲并加长超时
    location / {
        proxy_pass http://172.17.1.40:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 51820 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 250M;

    # ===== API 反向代理（走宿主机回环） =====
    location /api/ {
        proxy_pass http://127.0.0.1:${BACKEND_HOST_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ===== 静态资源代理 =====
    location /static/ {
        proxy_pass http://127.0.0.1:${BACKEND_HOST_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== 健康检查 =====
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ===== AI 助手迁移（ADR-0001）=====
    # 本配置为 host 网络模式的通用 default_server（无 ${DOMAIN} 占位符）：
    # www 旧地址的 301 请按实际域名在部署环境补齐（如 nginx.default.conf 中的规则）；
    # training. 子域名下的 /ai-assistant 由 SPA 正常服务
    location /ai-assistant {
        try_files $uri /index.html;
    }

    # ===== SPA 路由回退 =====
    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ===== 安全头 =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== 禁止访问隐藏文件 =====
    location ~ /\. {
        deny all;
        access_log off;
    }

    # ===== Gzip 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;
}
