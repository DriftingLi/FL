# ===== 前端 Nginx 配置（host 网络模式，用于 PVE 环境） =====
# 适用场景：PVE 宿主机 iptables FORWARD policy DROP 导致 Docker 网桥外部访问不通
# 解决方案：frontend 用 network_mode: host，nginx 直接监听宿主机 80/443 端口
#           backend 端口映射到 127.0.0.1:8080，nginx 通过回环地址反代
# 挂载路径：/etc/nginx/conf.d/default.conf.template
# SSL：证书由 CD 流水线（SSL_FULLCHAIN/SSL_PRIVKEY Secrets）写入
#      ${DEPLOY_PATH}/nginx/ssl，compose 挂载到容器 /etc/nginx/ssl
# 监听说明：镜像 master 以 root 运行以绑定 80/443（host 网络模式下非 root 无有效能力），
#           worker 由 nginx.conf 的 user nginx; 降权
# 协议策略：80 端口统一 301 → HTTPS（/health 存活探测除外）

# ===== HTTP 80：全部重定向到 HTTPS =====
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 250M;

    # 健康检查端点：不重定向到 HTTPS
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # 百度站长文件验证：http 直接反代到门户，避免被 301→https 拦截
    location /baidu_verify_ {
        proxy_pass http://127.0.0.1:${PORTAL_HOST_PORT};
        proxy_set_header Host $host;
    }

    # ⚠️ 重定向必须放在 location / 里（issue #496）：server 级 return 在 nginx
    #    rewrite 阶段执行、先于 location 匹配，会把上面的 /health、/baidu_verify_
    #    全部短路成 301（/health 豁免因此从未生效过）。降级到 location / 后
    #    只兜住未被其他 location 命中的请求。
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== dify.gccsmile.com: 转发到内网 Dify 服务（LXC 172.17.1.46:80） =====
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dify.gccsmile.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 250M;

    # ===== 知识库图片反代（/kbimg/）=====
    # 叉车知识库（Dify 外部 KB）召回的图片链接形如 https://dify.gccsmile.com/kbimg/<obj>
    # 实际对象存于内网 Ceph RGW（pve-02 172.17.1.42:8088，bucket forklift-files，匿名可读）。
    # 仅允许 GET/HEAD，其余方法拒绝；proxy_pass 末尾 / 剥掉 /kbimg 前缀直接打到 RGW 根。
    location /kbimg/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://172.17.1.42:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Dify 大量使用 SSE 流式响应，需关闭缓冲并加长超时
    location / {
        proxy_pass http://172.17.1.46:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ===== www.gccsmile.com: 主站由官网门户（hrwai-portal, Nuxt/Nitro）接管 =====
# 门户容器监听宿主机 3000（${PORTAL_HOST_PORT}，compose 可覆盖）。
# 本块保证模板自包含：即使门户部署脚本注入的 ~^www\..+$ 分流块丢失，
# www 也不会落入下方 default_server 的 SPA（training 应用会再把主域名跳转回 training 子域）。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.${DOMAIN};

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 250M;

    # AI 助手已迁移至 training 子域名（ADR-0001）：www 旧地址 301
    location = /ai-assistant {
        return 301 https://training.${DOMAIN}/ai-assistant;
    }

    # ===== 对象存储公开读（STORAGE_DRIVER=r2 时）=====
    # backend 返回 https://www.gccsmile.com/<key> 公开 URL（key 顶层含 featured/avatars/images/
    # reports/chapters/slides/uploads 等子目录前缀，直接与 RGW 对象 key 对齐）。
    # 本块反代到本机 RGW（Ceph 对象存储，监听 172.17.1.42:8088，bucket=forklift-files，公开读 policy）。
    # 监听 pve-02 内网 IP 而非 127.0.0.1：backend 容器（bridge 网络）内也用同一地址访问 RGW 做上传/删除，
    # 仅 127.0.0.1 的话容器内连不通，导致 S3 PutObject 静默失败。
    # 仅用于 GET 呈现；上传/删除走 backend S3 客户端，不经 nginx。
    # 注 1：仅匹配对象存储实际使用的子目录；images 顶层文件（如 /images/hero-bg.webp）是门户
    #       静态资源，不能反代到 RGW（会 403），保持走门户服务（下方 location /）。
    # 注 2：reports 文件（PDF）会随评分更新，缓存较短；其余图片资源缓存较长。
    location ~ ^/(featured|avatars|images/(forum|questions|chapters|ai-assistant)|chapters|slides|uploads)/ {
        rewrite ^/(.*)$ /forklift-files/$1 break;
        proxy_pass http://172.17.1.42:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location ~ ^/reports/ {
        rewrite ^/reports/(.*)$ /forklift-files/reports/$1 break;
        proxy_pass http://172.17.1.42:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Swagger 文档（gin-swagger，仅 www 暴露，BasicAuth 在 backend 层校验；/swagger/*any）
    location ^~ /swagger {
        proxy_pass http://127.0.0.1:${BACKEND_HOST_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 供 Swagger UI 试调的 API（与业务子域同源代理，避免 www 跨域）
    location /api/ {
        proxy_pass http://127.0.0.1:${BACKEND_HOST_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:${PORTAL_HOST_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 门户 SSR HTML 不缓存（内容随发布更新）；静态资源缓存由门户自身管理
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

# 根域名（不带 www）301 到 www 固定版
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://www.${DOMAIN}$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 250M;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== API 反向代理（走宿主机回环） =====
    location /api/ {
        proxy_pass http://127.0.0.1:${BACKEND_HOST_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ===== 静态资源代理 =====
    location /static/ {
        proxy_pass http://127.0.0.1:${BACKEND_HOST_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== 健康检查 =====
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ===== AI 助手迁移（ADR-0001）=====
    # www 主站由上方 www.${DOMAIN} 块转发到门户（hrwai-portal）；
    # training. 子域名下的 /ai-assistant 由 SPA 正常服务
    location /ai-assistant {
        try_files $uri /index.html;
    }

    # ===== SPA 路由回退 =====
    location / {
        try_files $uri $uri/ /index.html;

        # SPA 入口 HTML 禁止缓存：index.html 内容随发布变化，
        # 浏览器缓存旧 SPA 会导致部署后用户拿到旧应用（子块静态资源缓存不受影响）
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    }

    # ===== 安全头 =====
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== 禁止访问隐藏文件 =====
    location ~ /\. {
        deny all;
        access_log off;
    }

    # ===== Gzip 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;
}
