# ===== 前端 Nginx 配置（HTTP-only 备用模板） =====
# ⚠️ 当前 production/testing 均已切换 80/443 HTTPS（见 nginx-host.conf），本模板不再被任何部署使用，
#    仅保留作极端场景（80/443 再次被封、需退回纯 HTTP）的手动备用。
# 挂载路径：/etc/nginx/conf.d/default.conf.template（覆盖默认 HTTPS 配置）

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 250M;

    # ===== API 反向代理 =====
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ===== 静态资源代理 =====
    location /static/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== 健康检查 =====
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ===== AI 助手（ADR-0001） =====
    # 旧 www/ai-assistant 请求由官网门户（Nuxt）接管后不再到达本服务器；
    # training. 子域名下的 /ai-assistant 由 SPA 正常服务
    location /ai-assistant {
        try_files $uri /index.html;
    }

    # ===== SPA 路由回退 =====
    location / {
        try_files $uri $uri/ /index.html;

        # SPA 入口 HTML 禁止缓存：index.html 内容随发布变化，
        # 浏览器缓存旧 SPA 会导致部署后用户拿到旧应用（子块静态资源缓存不受影响）
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ===== 安全头 =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== 禁止访问隐藏文件 =====
    location ~ /\. {
        deny all;
        access_log off;
    }

    # ===== Gzip 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;
}
