name: PR - 验收证据校验

# 本 workflow 是仓库「PR 事件不触发任何 CI/CD」的**唯一豁免**（依据 training-app/叉车维修培训学员端跨端应用/docs/adr/0008-移动端验收门与证据.md
# —— 写全路径：该 ADR 属移动端编号体系，根仓库另有一个同名的 ADR-0008，只写 docs/adr/0008-… 在根目录解析不到）：
# 它只读 PR 正文与改动文件清单，**不 checkout、不构建、不部署、不执行 PR 里的任何代码**，
# 因此 PR 事件在这里不产生构建/部署副作用。若要新增其他 PR 触发 workflow，先改 ADR-0008。
#
# **A1 形态（2026-10-29，#2100）**：证据只有一个来源 —— **PR 正文**。
#   一行 `跑于 <sha7>` + 门自带的机读读数行；判据只校「行在不在、读数行在不在、sha 绑不绑得上 head」。
#   本 job 因此**不再读任何评论**（PR 评论 / commit 评论 / 票评论三条取数路径全部退役），
#   `issues: read` 权限随之删除 —— 少了三次分页取数，也少了「证据贴在哪」这个自由度。
#   失效条件写明：只校结构与 sha 绑定，**不校真伪**（不校验那次门是否真的按该 sha 跑过），真伪由维护者判定。
#
# 判据源码在 .github/scripts/lib/gate-validator.mjs（单一来源，本地预检 preflight-pr.mjs 直接 import
# 同一份）。本 job 不 checkout，用 repos.getContent 取该文件文本 → 剥 `export` → new Function 求值；
# 取的是**默认分支**上的版本（PR 改不了自己的判据）。

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# 权限（2026-10-29 复核，A1 后按需最小集）：
#   pull-requests: read → 读 PR 正文与改动文件清单（pulls.listFiles）
#   contents: read      → repos.compareCommits（判 `跑于 <sha7>` 是否为 head 祖先、其间改了哪些文件）
#                         + repos.getContent（取判据模块文本，不 checkout）
# 两项之外一个不多给：本 job 不 checkout、不读评论、不写任何东西、不碰 actions/secrets。

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // ==== 判据来源（#1770）：校验器只有一份源码 .github/scripts/lib/gate-validator.mjs ====
            // 本 job 不 checkout（见文件头），用 repos.getContent 取模块文本 → 剥掉行首 export → new Function 求值。
            // 取**默认分支**（pull_request.base.ref）而不是 PR head：PR 不能改自己的判据。
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const readRepoFile = async (path, ref) => {
              const res = await github.rest.repos.getContent({ owner, repo, path, ref });
              const data = res.data;
              if (!data || Array.isArray(data) || !data.content) {
                throw new Error(`getContent(${path}@${String(ref).slice(0, 7)}) 没有返回文件内容`);
              }
              return Buffer.from(data.content, data.encoding === 'base64' ? 'base64' : 'utf8').toString('utf8');
            };
            // 迁移期兜底（从 pr-evidence.yml 抽内联块）已于 A1 删除：它读的 marker 块早已不存在，
            // 留着只是一条永远走不到的分支。取不到模块就如实失败——判据缺失不该被"降级"成放行。
            const srcText = await readRepoFile('.github/scripts/lib/gate-validator.mjs', context.payload.pull_request.base.ref);
            const { validatePrEvidence } = new Function(`${srcText.replace(/^export /gm, '')}\nreturn { validatePrEvidence };`)();

            const pr = context.payload.pull_request;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });

            // 注入「取 compare 结果」的回调（校验器保持纯函数、可单测注桩）。
            // 判据是「`跑于 <sha7>` 是否为 head 祖先 + 其间运行时面是否变过」，都落在 compare 上：
            //   status / merge_base_commit 判祖先；files[].filename 交给校验器用同一 isRuntimeFile 过滤。
            // **fail-closed**：任何异常（未知 sha 的 404、超时、限流）都返回 null ⇒ 校验器判「不满足」，绝不放行。
            // **截断要写明**：GitHub 的 compare 接口 files 上限 300（与 listFiles 不同，这里不分页），
            //   超过即被截断 ⇒ 无法判定运行时面是否变过 ⇒ 按 fail-closed 判「不满足并要求重跑」，
            //   而不是拿被截断的列表当「没有运行时面改动」。
            const COMPARE_FILES_CAP = 300;
            const fetchCompare = async ({ base, head }) => {
              try {
                const res = await github.rest.repos.compareCommits({ owner, repo, base, head });
                const d = res.data || {};
                const status = String(d.status || '');
                // 改名必须算两次：`a.uvue` → `a.ts`（把逻辑抽进 .ts 是常见动作）时 compare 只报
                // `filename: a.ts`，不并 previous_filename 就会判「其间运行时面没动」⇒ 旧证据被接受。
                const raw = Array.isArray(d.files) ? d.files : null;
                const fileList = raw
                  ? raw.flatMap((f) => [f && f.filename, f && f.previous_filename].filter(Boolean))
                  : [];
                // 截断要按**原始文件数**判，不能用展开后的条数（一次改名会凭空多一条）。
                // 另：compare 可能因 diff 过大而干脆**不回** files（不是回 300 条）⇒ `length>=300` 判不出来
                // ⇒ 拿不到数组就按截断处理（identical 时 files 合法为空，除外）。
                const truncated = raw === null ? status !== 'identical' : raw.length >= COMPARE_FILES_CAP;
                return {
                  status,
                  mergeBaseSha: (d.merge_base_commit && d.merge_base_commit.sha) || '',
                  files: fileList,
                  filesTruncated: truncated,
                };
              } catch (e) {
                core.warning(`compareCommits(${String(base).slice(0, 7)}…${String(head).slice(0, 7)}) 失败：${e && e.message ? e.message : e} ⇒ 门证据绑定按 fail-closed 判不满足`);
                return null;
              }
            };

            const result = await validatePrEvidence({
              files, body: pr.body || '', headSha: pr.head.sha, fetchCompare,
            });

            await core.summary
              .addHeading('验收证据校验（ADR-0008 / A1）', 3)
              .addRaw(`命中运行时面的文件：${result.runtime.length} 个`).addEOL()
              .addList(result.runtime.length ? result.runtime : ['（无）'])
              .addRaw(`④b release 云打包门：${result.needs4b ? '打包面命中（A1 下不判红，发版前必跑）' : '未触发'}`).addEOL()
              .addList([...result.notes, ...result.errors.map((e) => `❌ ${e}`)])
              .write();

            if (!result.ok) {
              core.setFailed(`验收证据不完整：\n- ${result.errors.join('\n- ')}`);
            } else {
              core.info(`pr-evidence 通过：${result.notes.join(' / ')}`);
            }
