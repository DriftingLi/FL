name: PR - testing 冒烟补齐

# 为什么需要这条 workflow：
# ci.yml 的 testing 冒烟只在「分支 push 且该分支当时已有 open PR」时派发。
# 但开发流程是「先 push、再开 PR」—— 纯文档改动的 CI 只要 ~20 秒就结束，
# 那一刻 PR 还不存在，冒烟就被跳过，该 commit 因此永远缺少冒烟记录；
# 而 cd.yml 的生产 gate 要求这条记录，合并后会被阻断（实测复现于 PR #473）。
#
# #1852：本 job 自 2026-10-24 起是 **ruleset 必过检查**，于是它必须先于合并跑完并派发冒烟 ——
# 否则会出现「检查还在排队、auto-merge 已经把 head 分支删掉」的竞态：实测
# `gh workflow run --ref <分支>` → `HTTP 422: No ref found` ⇒ 没有 deployment 记录 ⇒ gate 阻断生产。
# 两条配套约束（缺一条这个必过检查就会误伤）：
#   1. `types` 必须含 `synchronize`：PR 开了之后再推新 commit，新 head sha 也要有这条检查
#      （必过检查在某个 sha 上缺失 = 那个 sha 永远合不了）；
#   2. 收到事件时 CI 往往还没跑完 —— 所以这里**等** ci-summary 出结论（最多 15 分钟），
#      绿了才派发；CI 红就直接放行（合并本就被 ci-summary 挡着）。
#
# #2120：上面那个修法留了一个空洞 —— 本 job 原先「派发完就 exit 0」，于是**检查绿 ≠ 记录在**。
# 派发出去的 CD run 在 cd-testing 组繁忙时只是排队；合并一旦发生在它前面，删分支会把排队中的 run 一起
# 取消（实测 2026-10-29：run 40811195831 一个作业都没启动就被 cancelled），deployment 记录于是永不存在，
# 而 cd.yml 的生产 gate 要求它 ⇒ 生产部署被永久阻断（`69ec84d6` / `7dee52b7` 连中两次）。
# 现语义：**派发后等这条 run 真的 success，并复核 deployment 记录存在，才让检查变绿**；cancelled / 超时
# 一律 fail-closed 判红。代价是合并要等一次 testing 部署的时间（绿不了的 PR 本就不该合）。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

permissions:
  contents: read
  actions: write
  pull-requests: read
  deployments: read

concurrency:
  # cancel-in-progress：同一个 PR 连推多个 commit 时，旧 sha 的等待已经没有意义
  group: smoke-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  ensure-testing-smoke:
    # 跳过草稿 PR：草稿阶段不该占 testing 机器（标记 ready_for_review 时会再触发一次）
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # ADR-0053 §10：ci-summary 的聚合收成了单点脚本（scripts/ci-summary-status.sh），
      # 本 job 原先刻意不 checkout（gh 用 --repo 显式指定仓库），但脚本文件必须存在于工作区 ——
      # 故补一个浅 checkout（只取文件，不取历史），代价 ~1s。
      - name: Checkout（仅为取到聚合脚本）
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 等 CI 结论并补发 testing 冒烟
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "fork 来源的 PR（$HEAD_REPO），无法在本仓库按 ref 派发冒烟，交由 CI 处理" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ===== 1. 等 ci-summary 出结论（missing/other = 还没跑完）=====
          # 上限 15 分钟：本仓最长的一条腿是 backend-test（实测 9~10 分钟），留足余量。
          DEADLINE=$(( $(date +%s) + 900 ))
          while :; do
            # 与 cd.yml gate 共用同一份聚合实现（ADR-0053 §10 的单点）
            CI=$(bash scripts/ci-summary-status.sh "$SHA")
            case "$CI" in
              success|failure) break ;;
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::等不到 commit ${SHA:0:8} 的 ci-summary 结论（15 分钟），无法判定是否需要补发冒烟"
              exit 1
            fi
            echo "ci-summary=$CI（尚未出结论），20 秒后重试…"
            sleep 20
          done

          if [ "$CI" != "success" ]; then
            echo "ci-summary=$CI，CI 未通过 ⇒ 不补发冒烟（合并本就被 ci-summary 挡住）" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ===== 2. 已有记录就不重复部署 =====
          DEP=$(gh api "repos/$GITHUB_REPOSITORY/deployments?per_page=100" \
                 --jq "[.[] | select(.sha==\"$SHA\" and .environment==\"testing\")] | length")
          if [ "$DEP" != "0" ]; then
            echo "commit ${SHA:0:8} 已有 testing 冒烟记录，无需补发" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ===== 3. 派发 =====
          echo ">>> CI 已绿但缺冒烟记录（CI 跑完早于开 PR），补发 testing 部署" | tee -a "$GITHUB_STEP_SUMMARY"
          # 与 ci.yml 的派发方式保持一致：--ref 用分支名，使 CD run 与部署记录的 sha == 被测 SHA
          # （workflow_dispatch 的 --ref 不接受裸 SHA；`refs/pull/<n>/head` 也实测 422 —— #1852 里试过）。
          # 必须显式 --repo：本 job 不 checkout，gh 没有 git 上下文可推断仓库
          if ! gh workflow run cd.yml --repo "$GITHUB_REPOSITORY" \
                 --ref "$REF" -f ref="$SHA" -f environment=testing; then
            echo "::error::派发失败（分支 ${REF} 可能已被删除）。这是 #1852 描述过的竞态：本检查若为必过检查，正常应发生在合并之前；走人工合并时请用应急通道 gh workflow run cd.yml -f environment=production -f ref=${SHA}"
            exit 1
          fi
          echo "| 补发 | PR #${PR_NUMBER} · commit ${SHA:0:8} → testing |" >> "$GITHUB_STEP_SUMMARY"

          # ===== 4. 等这条 run 真的成功（#2120：让「检查绿」⇔「deployment 记录已存在」）=====
          # 以前派发完就 exit 0，检查在冒烟尚未成功时即变绿；合并一旦抢先（cd-testing 组繁忙时必然如此），
          # 删分支会把排队中的 run 取消 ⇒ 记录永不出现 ⇒ 生产 gate 永久阻断。
          RUN_ID=''
          FIND_DEADLINE=$(( $(date +%s) + 120 ))
          while :; do
            # 注意：这里不能写 `[ -n "$RUN_ID" ] && break` —— 独立语句在 set -e 下失败即退出（首次迭代必然失败）
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cd.yml --event workflow_dispatch \
                       --limit 30 --json databaseId,headSha,createdAt \
                       --jq "[.[] | select(.headSha==\"$SHA\")] | sort_by(.createdAt) | last | .databaseId // empty" || true)
            if [ -n "$RUN_ID" ]; then break; fi
            if [ "$(date +%s)" -ge "$FIND_DEADLINE" ]; then
              echo "::error::派发后 2 分钟仍找不到 commit ${SHA:0:8} 的 CD run —— 无法确认冒烟是否真的跑起来，不放行"
              exit 1
            fi
            sleep 10
          done
          echo "| 冒烟 run | [${RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}) |" >> "$GITHUB_STEP_SUMMARY"

          WAIT_DEADLINE=$(( $(date +%s) + 2400 ))
          while :; do
            SMOKE=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion \
                     --jq '"\(.status)/\(.conclusion // "-")"' || echo 'unknown/-')
            case "$SMOKE" in
              completed/success) break ;;
              completed/*)
                echo "::error::testing 冒烟 run ${RUN_ID} 结束为 ${SMOKE#completed/}（不是 success）⇒ 不放行：生产 gate 会找不到成功记录。处置：看该 run 日志；若是排队被取消或机器问题，重跑本检查，或手动 gh workflow run cd.yml --repo ${GITHUB_REPOSITORY} --ref master -f environment=testing -f ref=${SHA}"
                exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$WAIT_DEADLINE" ]; then
              echo "::error::等 testing 冒烟 run ${RUN_ID} 超过 40 分钟仍未完成（当前 ${SMOKE}）⇒ fail-closed 不绿灯。多半是 cd-testing 组被别的部署占着（cd.yml 按环境串行）"
              exit 1
            fi
            echo "testing 冒烟 ${SMOKE}，30 秒后重试…"
            sleep 30
          done

          # ===== 5. 复核 deployment 记录（把「检查绿但没记录」变回红）=====
          DEP=$(gh api "repos/$GITHUB_REPOSITORY/deployments?per_page=100" \
                 --jq "[.[] | select(.sha==\"$SHA\" and .environment==\"testing\")] | length")
          if [ "$DEP" = "0" ]; then
            echo "::error::run ${RUN_ID} 虽 success，但按 sha=${SHA:0:8} + environment=testing 仍查不到 deployment 记录 ⇒ 生产 gate 依然会阻断"
            exit 1
          fi
          echo "✅ testing 冒烟记录已就位（sha=${SHA:0:8}，deployment 共 ${DEP} 条）" | tee -a "$GITHUB_STEP_SUMMARY"
