name: CI - 持续集成

# 只在「非 master 分支 push」时跑 CI：
#   - master push 不跑：合并后由 cd.yml 的 push 触发器直发 production（gate 校验来源 PR 的 CI 结论）
#   - pull_request 不跑：同一 commit 上 push 事件产生的 job check run 已经出现在 PR 的
#     Checks 面板并能满足 ruleset 必检，无需再跑第二遍全量 CI（历史上一次 push 要等 8m×2）
on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 钉到含 2026-10 那批 net/http 公告修复的补丁版（#1623）：写成 "1.26" 时 setup-go 命中缓存里的
  # 1.26.8，security-scan 的 govulncheck 稳定判红（全仓后端 PR 一起红，且与改动无关）。
  # 1.26.10 修 GO-2026-6809（crypto/x509 中间证书信任）；1.26.9 在 2026-10-21 被 govulncheck 判红（#1744）。
  GO_VERSION: "1.26.10"
  NODE_VERSION: "24"

jobs:
  # ============================================================
  # Stage 1: 代码变更检测（backend/frontend 无关变更时跳过对应 job，但 ci-summary 仍会上报结论）
  # ============================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # 生成物：aiFeatures.ts 由 backend/internal/aiassistant 渲染，契约测试（TestFrontendAIFeaturesTSInSync）
              # 住在后端。只改这个前端文件时若不带后端，生成物与模板漂移会一路绿到合并（#1892 实测踩中）。
              - 'frontend/src/config/aiFeatures.ts'
              # 部署面漂移锁（backend/internal/deploy）读 deploy/ 下的 compose / deploy.py /
              # env.defaults；只改部署面时若不跑 backend-test，默认值漂移会一路绿到合并。
              - 'deploy/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            mobile:
              - 'training-app/**'
              - '.github/workflows/**'

  # ============================================================
  # Stage 2: 后端 - 代码质量
  # ============================================================
  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Go 代码格式化检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet 静态分析
        run: go vet ./...

      # Swagger 产物新鲜度（ADR-0019 专项第一步 / spec #940 片五①）：注解是唯一事实源，
      # 生成物过期（改了注解没跑 make swagger）以前只有人肉发现 —— 这里让它直接红。
      # swag 版本显式钉住：产物要字节可比，工具链漂移会让这条锁变成噪声源。
      - name: Swagger 产物新鲜度（注解 → backend/docs 必须同步）
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          "$(go env GOPATH)/bin/swag" init -g cmd/server/main.go -o docs
          cd "$GITHUB_WORKSPACE"
          if ! git diff --exit-code -- backend/docs; then
            echo "::error::backend/docs 与注解不同步：请在 backend 下执行 make swagger 并提交生成物"
            exit 1
          fi

      - name: golangci-lint 代码检查
        run: |
          # 固定版本安装，避免 @latest 随上游变动导致 CI 结果漂移
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run --timeout=5m
        working-directory: backend

      # 目录排序串第二源守卫（ADR-0060 决策 10 / 第十三波票 10）：目录读面（文件名含 catalog 的
      # 非测试 .go）不得再出现与 catalog descriptor 的 OrderBy 声明逐字同串的裸排序串——排序串
      # 只有一个宿主（spec 表），改一处即两面同效。用全量模式：收口后当前树实测 0 违规，
      # 规则可以绝对化执行（同 frontend-check 里那几个 --all 守卫的口径）；判定逻辑的自检在
      # el-controls-selftest job。
      - name: Set up Node.js（守卫脚本用，无 npm 依赖）
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 目录排序串第二源守卫（读面不得重抄 spec 声明）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-catalog-sort.mjs --all

      - name: 端点错误面守卫（Render 闭包内不得渲染错误信封）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-render-error-face.mjs --all

      # issue #1445 的 P4（注释治理）：锁三类机检得出、且与「代码写的事实」相矛盾的注释欠账 ——
      # 失真包文档（文件头写 Package service 而包名不是它）/ 装饰分隔线 / 相邻重复注释行。
      # 基线 0、只减不增；判据与三类理由见 docs/agents/comments.md 第 3、5 节。
      - name: 注释三态守卫（失真包文档 / 装饰分隔线 / 相邻重复注释行）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-comment-cleanliness.mjs --all

  # ============================================================
  # Stage 3: 后端 - 单元测试（按包分片，LPT 装箱）
  #   分片的收益下限由**最慢的包**决定：实测 internal/api 单包 400.2s，而整个 job 571s ⇒
  #   两片（api + 零头一片、其余 64 包一片）就够，再多切只是多烧 runner（k=2/3/4 的墙钟
  #   模型都卡在 400s，见 #1862）。权重表 scripts/go-package-timings.json、切片器
  #   scripts/go-shard.mjs；本片为空 ⇒ 切片器退出码 3 让 job 红（空片绝不许当绿），
  #   判据自检在 el-controls-selftest（scripts/go-shard.test.mjs）。
  #   与 backend-lint **并行**（needs 里去掉它）：两者无任何产物依赖，串行只白等 140s。
  #   代价：lint 红时不再抢在 10 分钟测试之前报错 —— 一次失败多烧 ~7 min runner 时间。
  # ============================================================
  backend-test:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: forklift_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 运行单元测试（第 ${{ matrix.shard }}/2 片）
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/forklift_test?sslmode=disable
          SHARD: ${{ matrix.shard }}
          SHARDS: '2'
        # -timeout 收回 10m（2026-09-29，#1366 测试面瘦身）：先前抬到 20m 是止血——internal/api
        # 单包串行 -race -cover 实测压到 ~600s 线（一次 runner 抖动即「panic: test timed out after
        # 10m0s」的与改动无关假红）。#1366 给非 PG 契约用例加 t.Parallel（并把 gin 模式位与
        # testutil 的进程级 uid 计数器这两处包级可变状态各自收敛成 Once / 互斥，消掉 -race 竞态），
        # 4 核同环境实测（-race -cover、PG 起）internal/api 由 553s 降到 297s、0 数据竞态、覆盖率不变
        # 77.4%；PG 契约用例仍串行（golang-migrate 的 pg_advisory_lock 是全库级，并发建 schema 只会
        # 互相排队）。包级预算回到默认 10m 线内且留有余量，故收回抬高、恢复这条线本应承担的门禁意义。
        run: |
          set -euo pipefail
          # 判据不另造清单：本片跑哪些包由切片器按 go list 现算，权重表只影响**分到哪片**、
          # 不影响**会不会被测到**（两片并集恒等于 go list ./...，自检里钉死）。空片 fail-closed。
          go list ./... > /tmp/all-packages.txt
          total=$(grep -c . /tmp/all-packages.txt || true)
          if [ "$total" -eq 0 ]; then
            echo "错误: go list 取到 0 个包（判据失效，不许当绿）"
            exit 1
          fi
          node ../scripts/go-shard.mjs --shard "$SHARD" --shards "$SHARDS" \
            --list /tmp/all-packages.txt --weights ../scripts/go-package-timings.json \
            > /tmp/shard-packages.txt
          mapfile -t PKGS < /tmp/shard-packages.txt
          echo "本片从 $total 个包里取 ${#PKGS[@]} 个："
          printf '  %s\n' "${PKGS[@]}"
          go test "${PKGS[@]}" -race -cover -coverprofile=coverage.txt -timeout 10m

      - name: 上传覆盖率报告（第 ${{ matrix.shard }}/2 片）
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: backend/coverage.txt

  # ============================================================
  # Stage 4: 前端 - 类型检查 + 构建
  # ============================================================
  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm install

      # 部署面生成物新鲜度（ADR-0066 决策 2 / 票 #1364）：Caddy 的 RGW 投递分档匹配器由
      # service.fileTypeTable 现算、就地覆写 frontend/Caddyfile 的生成区。
      # 为什么挂在 frontend-check 而不是 backend-lint：生成物住在 frontend/，而 backend-lint /
      # backend-test 都由 changes.backend 门控 —— 只改 Caddyfile（手改生成区、删掉一档）
      # 时那两个 job 根本不跑，锁必须在这个面上也真跑一次。判据与上面的「Swagger 产物新鲜度」
      # 同形：现算 → git diff 必须为空（同一次现算也顺带证明再生成是幂等的）。
      - name: Set up Go（部署面生成物新鲜度用）
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 部署面生成物新鲜度（类型表 → Caddy 投递分档匹配器必须同步）
        working-directory: ${{ github.workspace }}
        run: |
          (cd backend && go run ./cmd/gen-deploy -only caddy)
          if ! git diff --exit-code -- frontend/Caddyfile; then
            echo "::error::frontend/Caddyfile 的投递分档生成区与 service.fileTypeTable 不同步：请在 backend 下执行 go run ./cmd/gen-deploy 并提交生成物"
            exit 1
          fi
          # 同一面再跑一遍 Caddy 的锁（全等 / 逐档 / 大小写语义 / 接线 / 结构 / 回源鉴权 / 部署链）。
          # 为什么要在这里再跑一次 backend 包的测试：接线锁判的是 cdn 块里那两行 header，它们在
          # 生成区**之外** ⇒ 上面的 git diff 比对看不见；而只改那两行（摘掉分档头、把值写死成
          # attachment）的改动只命中 frontend/** ⇒ backend-lint / backend-test 整个被 changes.backend
          # 跳过，全 CI 只有这个 job 会跑到。-count=1 是硬要求：产物在 Go 模块外、不算进 go test
          # 结果缓存的输入集，而 setup-go 的缓存按 go.sum 取键 ⇒ 不加就会回 cached ok（ADR-0066 实施回记）。
          (cd backend && go test ./internal/deploy/ -run TestCaddy -count=1)
          (cd backend && go test ./internal/deploy/ -run TestDeployChain -count=1)

      - name: TypeScript 类型检查
        run: npm run type-check

      # 已收敛控件守卫（ADR-0035 备选转正 / spec #940 片一）：业务模板不得裸用封装层已收的 10 类控件。
      # 用全量模式而非 --diff：当前树实测 0 违规，规则可以绝对化执行；判定逻辑的自检在 el-controls-selftest。
      - name: 已收敛控件守卫（业务模板不得裸用封装控件）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-el-controls.mjs --all

      # UI 意图登记制守卫（ADR-0083 决策 6 / #1982）：黑名单换成白名单 —— 登记表就是判据，
      # 模板里出现登记表之外的 el-* 即红（原生登记 / 按域分批 / 子件 三种形态之外），容器外观的
      # 纯字面量圆角与阴影同样红。数据源是 docs/agents/ui-conventions.md 的登记表，运行时派生，
      # 不落第二份清单。判定逻辑的自检在 el-controls-selftest job。
      - name: UI 意图登记制守卫（未登记的裸 el-* / 越档的容器外观字面量）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-ui-intent.mjs --all

      # api seam 守卫（ADR-0053 §7 / spec #1049）：页面与业务组件不得直接引用请求层。
      # 同样用全量模式：本次收口把 18 处调用点全部收回 api 模块，当前树实测 0 违规
      # （唯一例外在脚本白名单里逐条登记了理由）。判定逻辑的自检在 api-seam-selftest。
      - name: api seam 守卫（页面不得直连请求层）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-api-seam.mjs --all

      # 契约消费面覆盖锁（ADR-0056 §11 / #1100）：请求层打出的每个 method+path 必须落在
      # apitypes.Domains 的端点集内（此前没有任何守卫管这个方向：消费了未登记端点无人变红）。
      # 存量欠条逐条登记在脚本 ALLOWLIST（现状 4 条，全是 createCrud 动态拼装；4 条巡检端点已随
      # #1097 补齐注解并登记域声明表后销账，脚本头部保留历史留痕），补一个销一个；
      # 条目挂在已登记端点上会被判红（销账信号）。
      # 判定逻辑的自检在 el-controls-selftest job 的「契约消费面覆盖锁」一步。
      - name: 契约消费面覆盖锁（请求层消费的端点必须已登记）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-api-consumers.mjs --all

      # 列表四段式守卫（ADR-0053 §6 / #1054）：页面不得重新手写四分支链。
      # 存量 15 个文件在脚本 ALLOWLIST 里逐条登记（迁移按批推进、迁一个销一个号）；
      # 新代码命中即报红。
      - name: 列表四段式守卫（页面不得手写四分支链）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-async-section.mjs --all

      # AI 助手发送编排守卫（ADR-0056 §10 / #1104）：pages/ai-assistant 不得再出现发送编排
      # （sendMessage / streamChat 两个入口名字），一轮发送的编排与三种终态在 store。
      # 判定逻辑的自检在 el-controls-selftest job。
      - name: AI 助手发送编排守卫（页面不得再起流式编排）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-ai-assistant-send.mjs --all

      # 无障碍档位守卫（#1892）：低对比度文字档不得回流。token 对比度矩阵锁在
      # frontend/src/assets/styles/__tests__/contrast.spec.ts（随 npm test 跑）；本步管「用法」。
      # 判定逻辑的自检在 el-controls-selftest job。
      - name: 无障碍档位守卫（低对比度文字档）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-a11y.mjs --all

      # 图标入口守卫（ADR-0079 / 票 #1911）：图标是数据 —— 业务侧不得再 import Element Plus 图标、
      # 不得写 <el-icon>、不得手写 24 网格图标 svg，<UiIcon> 必须带 name。
      # 迁移期例外逐条登记在 scripts/icon-legacy-baseline.json（#1912 清空，只减不增）。
      # 判定逻辑的自检在 el-controls-selftest job。
      - name: 图标入口守卫（图标一律走 UiIcon + 注册表）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-icons.mjs --all

      # 字号阶梯守卫（#1894 / ADR-0080）：字号只走 token 阶梯（12/14/16/18/20/24/30），
      # 禁 `text-[<数字>px]` / `text-[<数字>rem]` 直写（`em` 是相对单位、放行）。
      # 收口后当前树实测 0 处（116 处直写已全部映射到阶梯），规则绝对化执行。
      # 判定逻辑的自检在 el-controls-selftest job。
      - name: 字号阶梯守卫（字号只走 token 阶梯）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-font-scale.mjs --all

      # 守卫增量门（ADR-0056 §5 / #1094）：除上面的 --all 全量外，再按「相对默认分支的新增行」
      # 跑一遍九个守卫。**口径要说准**：增量门不比全量更严——判定面是同一棵树 --all 的子集
      # （同一条 scanSource，只是再按新增行号过滤），它补的是两件事：① CI 里真的走通「取 diff →
      # 解析新增行 → 扫描」这条管道（收敛前 check-async-section 的 --diff 因实参形态错恒 0 违规）；
      # ② --diff 自身 fail-closed（base 解析不了 / git diff 失败 / 新增文件读不出来都非零退出）。
      # 本 job 的 checkout 是浅克隆（默认 depth=1），base 历史不在工作区里，这里显式取回默认分支；
      # 取不回 → 本步红。浅历史里没有 merge base，added-lines 会按它既有的 CI 口径退成双点 diff。
      - name: 守卫增量门（九个守卫只看相对默认分支的新增行）
        working-directory: ${{ github.workspace }}
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          # 显式写目标 ref：checkout 是单分支浅克隆时，裸 `git fetch origin <branch>` 只写 FETCH_HEAD，
          # 不会建 origin/<branch>（本机用浅克隆实测过），守卫会因 base 不可得而红。
          git fetch --no-tags --depth=1 origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          node scripts/check-el-controls.mjs --diff "origin/$DEFAULT_BRANCH"
          node scripts/check-ui-intent.mjs --diff "origin/$DEFAULT_BRANCH"
          node scripts/check-api-seam.mjs --diff "origin/$DEFAULT_BRANCH"
          node scripts/check-async-section.mjs --diff "origin/$DEFAULT_BRANCH"
          node scripts/check-api-consumers.mjs --diff "origin/$DEFAULT_BRANCH"
          node scripts/check-ai-assistant-send.mjs --diff "origin/$DEFAULT_BRANCH"
          node scripts/check-a11y.mjs --diff "origin/$DEFAULT_BRANCH"
          node scripts/check-icons.mjs --diff "origin/$DEFAULT_BRANCH"
          node scripts/check-font-scale.mjs --diff "origin/$DEFAULT_BRANCH"

      - name: 前端单元测试
        run: npm test

      # 只查相对默认分支的新增行：存量裸 hex 由专项批次清理，不阻塞日常 PR
      - name: 硬编码色值检查（仅新增行）
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}" --depth=1
          bash scripts/check-bare-hex.sh --diff "origin/${{ github.event.repository.default_branch }}"

      - name: 生产构建
        run: npm run build

  # ============================================================
  # Stage 5: 安全扫描
  # ============================================================
  security-scan:
    needs: [changes, backend-test, frontend-check]
    if: always() && (needs.backend-test.result == 'success' || needs.frontend-check.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Go 依赖漏洞扫描
        if: needs.changes.outputs.backend == 'true'
        run: |
          cd backend
          # 固定版本安装，避免 @latest 随上游变动导致 CI 结果漂移
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Set up Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm install

      - name: npm 依赖漏洞扫描
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Dockerfile 安全分析
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: backend/Dockerfile
          # 高危配置问题才阻断，与 npm audit --audit-level=high 对齐
          severity: HIGH,CRITICAL
          exit-code: 1
          version: v0.74.0

  # ============================================================
  # Stage 6: 数据库迁移校验（#1099 / ADR-0056 §6）
  #   空库真跑 up（重建 baseline）→ 单向列对账（模型 ⊆ 实际）→ 真跑 down（回滚到空库，
  #   并断言对账仍能报出缺表）。此前的版本只 find | wc -l 数文件个数，一行都没连过这里起的库。
  # ============================================================
  migration-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: forklift_migrate
          POSTGRES_USER: migrateuser
          POSTGRES_PASSWORD: migratepass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      # 迁移 / 对账 / 回滚三步共用同一个空库连接串（服务容器见上方 services.postgres）
      DATABASE_URL: postgres://migrateuser:migratepass@localhost:5432/forklift_migrate?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 迁移文件成对性预检（命名 + up/down 配对，不连库）
        run: |
          echo ">>> 检查迁移脚本..."
          UP_COUNT=$(find migrations -name "*.up.sql" | wc -l)
          DOWN_COUNT=$(find migrations -name "*.down.sql" | wc -l)
          echo "UP: $UP_COUNT, DOWN: $DOWN_COUNT"
          if [ "$UP_COUNT" -ne "$DOWN_COUNT" ]; then
            echo "错误: UP 和 DOWN 迁移文件数量不一致!"
            exit 1
          fi
          echo "迁移文件完整性检查通过"

      - name: 真跑 migrate up（空库重建 baseline）
        run: |
          echo ">>> 在空库上执行全部 up 迁移..."
          go run ./cmd/migrate up

      - name: 单向列对账（GORM 模型期望的列 ⊆ information_schema 实际列）
        run: |
          echo ">>> 列对账：模型加了字段却忘写迁移，在这里红..."
          go run ./cmd/migrate check-columns

      - name: 真跑 migrate down（回滚到空库；此时对账必须报缺表）
        run: |
          echo ">>> 回滚全部迁移..."
          go run ./cmd/migrate down
          # down 之后业务表应当全部消失。用上一步同一个对账命令做**反向断言**：
          # 它必须非零退出，且失败输出里必须点名 baseline 的关键表。这样
          # 「回滚干净」与「缺表确实会被报出来」在同一条真实链路上各验证一次，
          # 而不是靠人数一遍。
          if go run ./cmd/migrate check-columns >/tmp/after-down.log 2>&1; then
            echo "错误: down 之后列对账仍然通过——业务表没有随迁移一起回滚"
            cat /tmp/after-down.log
            exit 1
          fi
          for t in hrwai_users question credential; do
            grep -q "\"$t\"" /tmp/after-down.log || {
              echo "错误: down 后对账未报出整表缺失: $t"
              cat /tmp/after-down.log
              exit 1
            }
          done
          echo "回滚验证通过：hrwai_users / question / credential 已随 down 消失，且对账能报出缺表"

  # ============================================================
  # Stage 6.5: 移动端 - 契约与静态守护单测（jest node 环境，无浏览器依赖）
  # ============================================================
  mobile-test:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    # 两腿片数不同（2026-10-16 立分片见 ADR-0041 决策 2；2026-10-18 拆腿见移动端 ADR-0042；
    # 2026-10-24 片数裁定见 #1890）：unit 腿 ×2 + behavior 腿 ×4 = 6 个子 job。
    #   unit 腿   = jest.config.unit.js   （纯逻辑 / 接线套件，120 个）
    #   behavior 腿 = jest.config.behavior.js（直接调用 pwsh 脚本的行为套件，72 个）
    # 两条腿**各自独立一份 testMatch**（本地入口 test:unit / test:behavior 同源），CI 这里
    # 走同一对 config 文件 ⇒ 「本地绿了 CI 却跑了另一套套件」这件事结构上不可能发生。
    # 拆腿时全量 189 套件 / 3579 用例 / 实测 423.5 s（run 39090642299），最慢单套件
    # utils/wirelessDebugBehavior.test.js 独占 108.6 s ⇒ 单进程串行是墙钟主因。
    # **分片 = 分机器**，不是把 -i 改成并行：每片内部仍 `-i` 串行，于是
    # jest.config.unit.js 文件头记的「#1410 怕的是同机 CPU 争抢下的 5s 超时抖动」
    # 一点没引入（该文件头同时记了「套件无跨套件共享面」= 分机器切分安全的依据）。
    # unit 腿压到 ×2 的理由（#1890，实测 run 40074702204——跑在分支 commit bcfe67347 上，
    # 只取其片数/时长读数，用例数不与本树对账）：unit 120 套件无一进 ≥5s 权重表、
    # 全按 defaultSeconds=1 计权，四片实跑只有 7/8/5/10 s——③ 门墙钟由 behavior 腿决定
    # （四片 ~534 s），unit 腿片数的唯一真实花销是 job 数（每 job 另有 ~14s checkout + npm ci）。
    # ×1 否决：边际只多省 1 个 job，装箱维度归零、腿增长无缓冲。behavior ×4 恰在收益顶，不动；
    # 权重表已于 #1900 重采（run 40111032652）。pwsh 类套件单次方差大（wirelessDebugBehavior
    # 两次采集 108s ↔ 202s）⇒ 最慢片下界 = max(总/4, 最慢套件) 随之摆动，装箱不追方差——漂移是常态，
    # 重采只是把权重对齐口径，别指望它消掉长尾。
    # fail-fast: false —— 每片都要出结论，别让首片红把其余片的判读信息掐掉。
    # 腿名 → config（连同各腿总片数）的映射只写在 matrix.include 这一处，步骤里用 matrix.config，
    # 不另造清单。unit 片集 = 顶层 leg × shard 全积 exclude 掉 3/4 两片 ⇒ 只剩 1、2。别把 shard 集
    # 直接写进 include 的数组值里——GitHub **不展开 include 里的数组**、每个对象只落一个组合
    # （2026-10-24 run 40085045853 实测：两腿各 1 个 job、matrix.shard 原样是数组），与 jest 27
    # 对 `--shard` 的静默忽略同型的坑。
    strategy:
      fail-fast: false
      matrix:
        leg: [unit, behavior]
        shard: [1, 2, 3, 4]
        exclude:
          # unit 腿 ×2（#1890）：从全积摘掉第 3/4 片。
          - leg: unit
            shard: 3
          - leg: unit
            shard: 4
        include:
          - leg: unit
            config: jest.config.unit.js
            shards: 2
          - leg: behavior
            config: jest.config.behavior.js
            shards: 4
    defaults:
      run:
        working-directory: training-app/叉车维修培训学员端跨端应用
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: training-app/叉车维修培训学员端跨端应用/package-lock.json
      # 单测是纯 node 环境（两条腿的 config 都是 testEnvironment=node，只扫 utils/**），不需要浏览器。
      # 曾经的两行 PUPPETEER_SKIP_* env 随 ADR-0020 一并移除（puppeteer 已不在 devDependencies）。
      - name: 安装依赖
        run: npm ci
      # 分片必须**自己算文件清单**：本仓 jest 是 27.5.1，`--shard=k/4` 是 jest 28 才有的选项，
      # 27 会把它当未知参数**静默忽略** ⇒ 每片照跑该腿全量套件（2026-10-16 实测：四片同时拉到
      # 6 分钟以上、等于成本 ×4 且一点没提速）。改成先 `--listTests` 取**本腿**清单、再用
      # `scripts/jest-fanout.mjs` 切出本片、用 `--runTestsByPath` 精确执行——判据仍是 jest
      # 自己的 testMatch，不另造清单。清单与执行**都用 matrix.config**（同一个文件）：腿内切片
      # 不会串腿，也不需要在这里认领。
      # 切分口径 = **LPT 按耗时装箱**（#1715）：`NR%4` 轮转不看单套件耗时，慢套件落哪片哪片就得等
      # 它（实测 run 39113010218：1:29 / 1:15 / 2:36 / 3:39，而 108.4s 的
      # utils/wirelessDebugBehavior.test.js 独占一片的长尾）。装箱在**本腿内**进行：每片目标 =
      # max(本腿总耗时/片数, 本腿最慢套件)，权重表 utils/jestSuiteTimings.json 两腿共用同一份键。
      # 表里没有的套件按 defaultSeconds 计权 ⇒ 新增套件不用回来改表，也不会让门红。
      - name: 单测（${{ matrix.leg }} 腿，第 ${{ matrix.shard }}/${{ matrix.shards }} 片）
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          LEG_CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          node node_modules/jest/bin/jest.js --config "$LEG_CONFIG" --listTests > /tmp/all-files.txt
          total=$(grep -c . /tmp/all-files.txt || true)
          if [ "$total" -eq 0 ]; then
            echo "错误: --listTests 取到 0 个套件（判据失效，不许当绿）"
            exit 1
          fi
          # LPT 装箱（#1715）：先按耗时降序，再依次放进当前负载最小的片。切片器自己会在
          # 本片为空时 exit 3（fail-closed），下面的显式守卫保留作第二道。
          node scripts/jest-fanout.mjs --shard "$SHARD" --shards "$SHARDS" --list /tmp/all-files.txt > /tmp/shard-files.txt
          count=$(grep -c . /tmp/shard-files.txt || true)
          echo "本片套件数: $count / 全量 $total"
          # 装箱下每片都非空；若真为空说明切分口径坏了，宁可红也别静默跑 0 个套件（血账 #1144）。
          if [ "$count" -eq 0 ]; then
            echo "错误: 第 $SHARD 片切到 0 个套件"
            exit 1
          fi
          set +e
          node node_modules/jest/bin/jest.js --config "$LEG_CONFIG" -i --runTestsByPath $(cat /tmp/shard-files.txt)
          code=$?
          set -e
          exit $code
      # 契约测试「读取层归一」守卫（移动端 ADR-0019 票 B / #1177）：只判相对默认分支的**新增行**。
      # 必须**显式写目标 ref**：checkout 是单分支浅克隆时，裸 `git fetch origin <branch>`
      # 只写 FETCH_HEAD、不建 `origin/<branch>`，守卫会因 base 不可得而 fail-closed 判红
      # （该坑位与 frontend-check 的「守卫增量门」同源，那段注释里有实测）。
      # 只在「unit 腿第 1 片」跑：它是**全仓静态扫描**、与分片无关，每个子 job 都跑一遍
      # 既不增信息也不减风险
      # （ADR-0041 决策 2；#1702 拆腿后多出一条腿，同样只认其中一条 —— 换个腿跑等价，别跑两遍）。
      - name: 契约测试读取层归一守卫（仅新增行）
        if: matrix.shard == 1 && matrix.leg == 'unit'
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch --no-tags --depth=1 origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          node scripts/check-contract-read.mjs --diff "origin/$DEFAULT_BRANCH"
      # 守卫自身的可执行单测（判据形状 + fail-closed；与前端 scripts/*.test.mjs 同款）。同上，只在 unit 腿第 1 片跑。
      - name: 读取层归一守卫自测
        if: matrix.shard == 1 && matrix.leg == 'unit'
        run: node scripts/check-contract-read.test.mjs
      # 分片器自测（#1715）：漏套件 / 重复套件 / 切到 0 个 / 退化成轮转 —— 四种坏法都要红。
      # 同样只在 unit 腿第 1 片跑（与分片无关的判据，每个子 job 都跑不增信息）。
      - name: 分片器自测（LPT 装箱判据）
        if: matrix.shard == 1 && matrix.leg == 'unit'
        run: node scripts/jest-fanout.test.mjs


  # ============================================================
  # Stage 6.6: pr-evidence 校验逻辑的自检（守护的守护）
  #   校验器在 .github/scripts/lib/gate-validator.mjs（#1770 起从 pr-evidence.yml 抽出的单一来源，
  #   pr-evidence.yml 用 repos.getContent 取它执行；管家 mobile-gates.yml 已随 A1（#2100）整份删除），本 job 直接 import 跑表驱动单测；
  #   本地预检（.github/scripts/preflight-pr.mjs）也 import 同一份，故它的纯函数与「双跑一致」一并在这里钉：
  #   逻辑被改坏或模块被删 → 这里红 → ci-summary 红 → 不能合并。
  # ============================================================
  pr-evidence-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 表驱动单测（pr-evidence 校验逻辑，import gate-validator.mjs）
        run: |
          node --test .github/scripts/pr-evidence-check.test.mjs
          # #1770：本地预检 = 同一判据 + ③ run 链接自动发现（占位不补），双跑一致性钉在这里
          node --test .github/scripts/preflight-pr.test.mjs
          # #2053：票面引用完整性 lint（preflight 同一份模块；路径/ADR 号位/票号三判据 + mergeRefLint 合并函数）
          node --test .github/scripts/lint-issue-references.test.mjs
          # #2139：证据日志可解码性（三类损坏 A/B1/B2 的判据 + mtime 范围口径 + mergeEncodingLint 合并函数）
          node --test .github/scripts/evidence-encoding.test.mjs

  # ============================================================
  # Stage 6.7: 已收敛控件守卫的自检（守护的守护）
  #   守卫坏了 = 规则静默失效 = 全绿假象。本 job 用表驱动单测喂源码文本，断言违规集合
  #   （正例 / 注释与字符串负例 / 放行面 / 边界），并跑一次 CLI 全量模式防假红。
  # ============================================================
  el-controls-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 表驱动单测（守卫判定逻辑）
        run: node --test scripts/check-el-controls.test.mjs

      # ADR-0083 决策 6 / #1982：派生（文档 → 集合）+ 两条规则的判定面，外加「合成违规必须判红」
      # 「干净源码必须判绿」「CLI --all 防假红」三个防恒绿用例。
      - name: 表驱动单测（UI 意图登记制守卫判定逻辑）
        run: node --test scripts/check-ui-intent.test.mjs

      - name: 表驱动单测（api seam 守卫判定逻辑）
        run: node --test scripts/check-api-seam.test.mjs

      - name: 表驱动单测（列表四段式守卫判定逻辑）
        run: node --test scripts/check-async-section.test.mjs

      # ci-summary 门禁自身的判据（真实缺陷 #2）：依赖闭包 + needs==check 清单相等。
      - name: 表驱动单测（CI 汇总门禁判定逻辑）
        run: node --test scripts/ci-summary-needs.test.mjs

      # backend-test 分片器（#1862）：分片是「哪些包会被测到」的判据 —— 它坏了，CI 会照常
      # 跑完两片却漏测一部分包（或某片空转假绿）。LPT 装箱 / 未知包兜底 / 空片 fail-closed 全钉住。
      - name: 表驱动单测（backend-test 分片器 LPT 装箱判据）
        run: node --test scripts/go-shard.test.mjs

      # 部署面常驻判据物（真实缺陷 #3 的回滚标签解析与镜像自证 + #1099 的迁移失败分支）。
      # 此前它们只在本地被引用、CI 零触发（2026-09-17 架构评审登记项）—— 一并接上。
      # ADR-0088 起判据物随部署面迁到 deploy/tests/（脚本本体 deploy/deploy.py，纯标准库 Python）。
      - name: 表驱动单测（回滚计划与镜像自证判定逻辑）
        run: node --test deploy/tests/deploy-rollback-plan.test.mjs
      - name: 表驱动单测（迁移失败门判定逻辑）
        run: node --test deploy/tests/deploy-migration-gate.test.mjs
      # 增量部署的核心判据：container/image/config-hash → 动作（skip/start/create/recreate/blocked）。
      # 数据服务配置漂移必须 blocked（不许自动重建），--force 也不许波及数据服务。
      - name: 单元测试（部署变更计划判定逻辑）
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py' -v
      # 部署面聚合后 compose 在 deploy/ 下；至少让 YAML / 相对路径 / 插值在 CI 里过一遍。
      - name: 部署 compose 语法校验
        run: docker compose -f deploy/docker-compose.prod.yml config -q

      - name: 表驱动单测（AI 助手发送编排守卫判定逻辑）
        run: node --test scripts/check-ai-assistant-send.test.mjs

      - name: 表驱动单测（无障碍档位守卫判定逻辑）
        run: node --test scripts/check-a11y.test.mjs

      # #1894 / ADR-0080：字号阶梯守卫的判定面（px / rem / 变体前缀 / 最近档提示 / 注释与
      # `em` 与 `text-[var(…)]` 负例），外加 CLI 全量防假红。
      - name: 表驱动单测（字号阶梯守卫判定逻辑）
        run: node --test scripts/check-font-scale.test.mjs

      # ADR-0079 / 票 #1911：四条判据的正例与负例（注释 / <script> 字符串 / 非 24 网格 / 带 name），
      # 外加「迁移期基线只减不增」（登记了却不再违规 → 报红，逼着删行）。
      - name: 表驱动单测（图标入口守卫判定逻辑）
        run: node --test scripts/check-icons.test.mjs

      # ADR-0056 §11 / #1100：消费面覆盖锁的判定面（嵌套泛型实参 / 变量路径 / 欠条销账 / 死条目）
      - name: 表驱动单测（契约消费面覆盖锁判定逻辑）
        run: node --test scripts/check-api-consumers.test.mjs

      # 注解覆盖审计的判定逻辑自检（issue #1425）：C/D 两段分桶——真缺口 vs basePath 之外的根级路由。
      # 这个 job 是**逐条点名**跑自检的，新增 .test.mjs 不往这里加一行就永远不会被执行。
      - name: 表驱动单测（注解覆盖审计的 C/D 分桶判定逻辑）
        run: node --test scripts/audit-api-annotations.test.mjs

      # ADR-0060 决策 10 / 第十三波票 10：目录排序串第二源守卫的判定面（第二源报红 / 收口形态与
      # ADR 明记「不动」的三类形态不误伤 / 声明表与 spec 表互等锁 / 合成违规目录必须判红防恒绿）。
      # 守卫本体跑在 backend-lint（扫的是 backend 的 .go）。
      - name: 表驱动单测（目录排序串第二源守卫判定逻辑）
        run: node --test scripts/check-catalog-sort.test.mjs

      # ADR-0060 决策 1 / 第十三波票 1b：端点错误面守卫的判定面（Render 闭包内的错误信封直写
      # 与域表调用报红 / 骨架与 raw handler 不误伤 / 合成违规必须判红防恒绿）。
      # 守卫本体跑在 backend-lint（扫 backend/internal/api 的 .go）。
      - name: 表驱动单测（端点错误面守卫判定逻辑）
        run: node --test scripts/check-render-error-face.test.mjs

      # issue #1445 P4：注释三态守卫的判定面（失真包文档 / 装饰分隔线 / 相邻重复注释行，
      # 且合成违规必须判红、干净 diff 必须判绿防恒绿）。守卫本体跑在 backend-lint（扫 backend 的 .go）。
      - name: 表驱动单测（注释三态守卫判定逻辑）
        run: node --test scripts/check-comment-cleanliness.test.mjs

      # ADR-0056 §5 / #1094：三个守卫共用的 runner 单点（argv / 走查 / --diff / allowlist /
      # 报告与退出码）—— 表驱动自测用合成 diff 端到端驱动，正样本必须红、负样本必须绿；
      # 历史病根是 --diff 实参形态错导致恒 0 违规而无人接住。
      - name: 表驱动单测（守卫 runner 单点）
        run: node --test scripts/guard.test.mjs

      # ADR-0053 §10：新增行解析是「判据的判据」，它错了两个守卫都会静默漏扫（假绿）
      - name: 表驱动单测（新增行解析单点实现）
        run: node --test scripts/lib/added-lines.test.mjs

      - name: 一致性锁（判据不许改回双份）
        run: node --test scripts/gate-predicates.test.mjs

  # ============================================================
  # Stage 7: CI 汇总 + testing 冒烟部署门禁
  #   1) 汇总各 job 结论。本 job 的 check run 名（ci-summary）是 ruleset 配置的
  #      必检状态检查，必须在每次分支 push 上运行并上报 success/failure，
  #      不能被 skip —— skipped 不满足必检，PR 会永远停在 pending 无法合并。
  #   2) CI 全绿且该分支有开启中的 PR 时，派发 CD workflow 部署 testing 冒烟。
  # ============================================================
  #   ⚠️ changes 必须在 needs 里（2026-09-28 修，真实缺陷 #2 / spec #1345）：它是所有子 job 的上游，
  #   漏掉它时「changes 失败 ⇒ 子 job 全部 skipped ⇒ FAILED 为空 ⇒ 汇总 success」，
  #   而 ci-summary 是 ruleset 唯一必检 + cd.yml 生产 gate 的唯一 CI 判据 ⇒ 零检查的 PR 可直发 production。
  #   两条锁见 scripts/ci-summary-needs.test.mjs（依赖闭包 + needs==check 清单相等），由 el-controls-selftest 跑。
  ci-summary:
    needs: [changes, backend-lint, backend-test, frontend-check, mobile-test, pr-evidence-selftest, el-controls-selftest, security-scan, migration-check]
    if: always()
    runs-on: ubuntu-latest
    # 触发 CD workflow_dispatch 需要 actions:write；查分支 open PR 需要 pull-requests:read
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: 检查是否全部通过
        run: |
          FAILED=""

          echo "# CI 检查报告" >> $GITHUB_STEP_SUMMARY
          echo "| Job | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY

          check() {
            local result=$1
            local name=$2
            if [ "$result" = "success" ]; then
              echo "| $name | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
            elif [ "$result" = "skipped" ] || [ "$result" = "cancelled" ]; then
              echo "| $name | ⏭️ 跳过 |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | ❌ 失败 |" >> $GITHUB_STEP_SUMMARY
              FAILED="${FAILED}$name "
            fi
          }

          # changes 先判：它失败会把下游全变成 skipped，而 skipped 不计入 FAILED（见上面的注释）
          check "${{ needs.changes.result }}" "changes"
          check "${{ needs.backend-lint.result }}" "backend-lint"
          check "${{ needs.backend-test.result }}" "backend-test"
          check "${{ needs.frontend-check.result }}" "frontend-check"
          check "${{ needs.mobile-test.result }}" "mobile-test"
          check "${{ needs.pr-evidence-selftest.result }}" "pr-evidence-selftest"
          check "${{ needs.el-controls-selftest.result }}" "el-controls-selftest"
          check "${{ needs.migration-check.result }}" "migration-check"
          check "${{ needs.security-scan.result }}" "security-scan"

          if [ -n "$FAILED" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**失败项: $FAILED**" >> $GITHUB_STEP_SUMMARY
            echo "CI_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**全部检查通过, 可以进入 CD 部署!**" >> $GITHUB_STEP_SUMMARY

      # CI 全部通过后,主动触发 CD workflow
      # gh CLI 需要 git 仓库上下文,必须先 checkout 代码
      # !cancelled()：run 被并发取消时,if: always() 的 ci-summary 仍会执行,
      # 不加这道判断会让「已被放弃的旧提交」照常派发部署（实测发生过）
      - uses: actions/checkout@v7
        if: success() && !cancelled() && github.event_name == 'push'

      - name: 判定是否部署 testing
        if: success() && !cancelled() && github.event_name == 'push'
        id: deploy-gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 只有开了 PR 的分支才值得占 testing 机器做冒烟：孤儿分支/试验分支直接跳过。
          # 用 REST head=<owner>:<branch> 精确匹配（gh pr list --head 的 owner 前缀写法
          # 在不同 gh 版本上表现不一致，已实测）
          PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" \
                 --jq '(.[0].number // empty)')
          if [ -z "$PR" ]; then
            echo "分支 $GITHUB_REF_NAME 无开启中的 PR,跳过 testing 部署" >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo ">>> 目标:PR #$PR → testing" >> "$GITHUB_STEP_SUMMARY"

      - name: 触发 testing 部署
        if: steps.deploy-gate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --ref 用分支名而非 master:让 CD run 的 head_sha == 被测 SHA,
          # 生产 gate 之后能按这个 SHA 反查 testing 部署结论
          echo ">>> 触发 CD workflow (testing), ref=$GITHUB_REF_NAME sha=$GITHUB_SHA"
          gh workflow run cd.yml \
            --ref "$GITHUB_REF_NAME" \
            -f ref="$GITHUB_SHA" \
            -f environment=testing
          echo "✅ CD workflow 已触发 (env: testing)"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**已触发 testing 冒烟部署 (commit: \`$GITHUB_SHA\`)**" >> "$GITHUB_STEP_SUMMARY"
