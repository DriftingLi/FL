name: CI - 持续集成

# 只在「非 master 分支 push」时跑 CI：
#   - master push 不跑：合并后由 cd.yml 的 push 触发器直发 production（gate 校验来源 PR 的 CI 结论）
#   - pull_request 不跑：同一 commit 上 push 事件产生的 job check run 已经出现在 PR 的
#     Checks 面板并能满足 ruleset 必检，无需再跑第二遍全量 CI（历史上一次 push 要等 8m×2）
on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # ============================================================
  # Stage 1: 代码变更检测（backend/frontend 无关变更时跳过对应 job，但 ci-summary 仍会上报结论）
  # ============================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  # ============================================================
  # Stage 2: 后端 - 代码质量
  # ============================================================
  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Go 代码格式化检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet 静态分析
        run: go vet ./...

      - name: golangci-lint 代码检查
        run: |
          # 固定版本安装，避免 @latest 随上游变动导致 CI 结果漂移
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run --timeout=5m
        working-directory: backend

  # ============================================================
  # Stage 3: 后端 - 单元测试
  # ============================================================
  backend-test:
    needs: [backend-lint, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: forklift_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 运行单元测试
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/forklift_test?sslmode=disable
          REDIS_ADDR: localhost:6379
          REDIS_PASSWORD: ""
          REDIS_DB: "0"
        run: go test ./... -race -cover -coverprofile=coverage.txt -timeout 10m

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.txt

  # ============================================================
  # Stage 4: 前端 - 类型检查 + 构建
  # ============================================================
  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm install

      - name: TypeScript 类型检查
        run: npm run type-check

      - name: 前端单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

  # ============================================================
  # Stage 5: 安全扫描
  # ============================================================
  security-scan:
    needs: [changes, backend-test, frontend-check]
    if: always() && (needs.backend-test.result == 'success' || needs.frontend-check.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Go 依赖漏洞扫描
        if: needs.changes.outputs.backend == 'true'
        run: |
          cd backend
          # 固定版本安装，避免 @latest 随上游变动导致 CI 结果漂移
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Set up Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm install

      - name: npm 依赖漏洞扫描
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Dockerfile 安全分析
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: backend/Dockerfile
          # 高危配置问题才阻断，与 npm audit --audit-level=high 对齐
          severity: HIGH,CRITICAL
          exit-code: 1
          version: v0.74.0

  # ============================================================
  # Stage 6: 数据库迁移校验
  # ============================================================
  migration-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: forklift_migrate
          POSTGRES_USER: migrateuser
          POSTGRES_PASSWORD: migratepass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 验证迁移脚本完整性（up + down）
        env:
          DATABASE_URL: postgres://migrateuser:migratepass@localhost:5432/forklift_migrate?sslmode=disable
        run: |
          echo ">>> 检查迁移脚本..."
          UP_COUNT=$(find migrations -name "*.up.sql" | wc -l)
          DOWN_COUNT=$(find migrations -name "*.down.sql" | wc -l)
          echo "UP: $UP_COUNT, DOWN: $DOWN_COUNT"
          if [ "$UP_COUNT" -ne "$DOWN_COUNT" ]; then
            echo "错误: UP 和 DOWN 迁移文件数量不一致!"
            exit 1
          fi
          echo "迁移文件完整性检查通过"

  # ============================================================
  # Stage 7: CI 汇总 + testing 冒烟部署门禁
  #   1) 汇总各 job 结论。本 job 的 check run 名（ci-summary）是 ruleset 配置的
  #      必检状态检查，必须在每次分支 push 上运行并上报 success/failure，
  #      不能被 skip —— skipped 不满足必检，PR 会永远停在 pending 无法合并。
  #   2) CI 全绿且该分支有开启中的 PR 时，派发 CD workflow 部署 testing 冒烟。
  # ============================================================
  ci-summary:
    needs: [backend-lint, backend-test, frontend-check, security-scan, migration-check]
    if: always()
    runs-on: ubuntu-latest
    # 触发 CD workflow_dispatch 需要 actions:write；查分支 open PR 需要 pull-requests:read
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: 检查是否全部通过
        run: |
          FAILED=""

          echo "# CI 检查报告" >> $GITHUB_STEP_SUMMARY
          echo "| Job | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY

          check() {
            local result=$1
            local name=$2
            if [ "$result" = "success" ]; then
              echo "| $name | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
            elif [ "$result" = "skipped" ] || [ "$result" = "cancelled" ]; then
              echo "| $name | ⏭️ 跳过 |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | ❌ 失败 |" >> $GITHUB_STEP_SUMMARY
              FAILED="${FAILED}$name "
            fi
          }

          check "${{ needs.backend-lint.result }}" "backend-lint"
          check "${{ needs.backend-test.result }}" "backend-test"
          check "${{ needs.frontend-check.result }}" "frontend-check"
          check "${{ needs.migration-check.result }}" "migration-check"
          check "${{ needs.security-scan.result }}" "security-scan"

          if [ -n "$FAILED" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**失败项: $FAILED**" >> $GITHUB_STEP_SUMMARY
            echo "CI_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**全部检查通过, 可以进入 CD 部署!**" >> $GITHUB_STEP_SUMMARY

      # CI 全部通过后,主动触发 CD workflow
      # gh CLI 需要 git 仓库上下文,必须先 checkout 代码
      # !cancelled()：run 被并发取消时,if: always() 的 ci-summary 仍会执行,
      # 不加这道判断会让「已被放弃的旧提交」照常派发部署（实测发生过）
      - uses: actions/checkout@v4
        if: success() && !cancelled() && github.event_name == 'push'

      - name: 判定是否部署 testing
        if: success() && !cancelled() && github.event_name == 'push'
        id: deploy-gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 只有开了 PR 的分支才值得占 testing 机器做冒烟：孤儿分支/试验分支直接跳过。
          # 用 REST head=<owner>:<branch> 精确匹配（gh pr list --head 的 owner 前缀写法
          # 在不同 gh 版本上表现不一致，已实测）
          PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" \
                 --jq '(.[0].number // empty)')
          if [ -z "$PR" ]; then
            echo "分支 $GITHUB_REF_NAME 无开启中的 PR,跳过 testing 部署" >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo ">>> 目标:PR #$PR → testing" >> "$GITHUB_STEP_SUMMARY"

      - name: 触发 testing 部署
        if: steps.deploy-gate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --ref 用分支名而非 master:让 CD run 的 head_sha == 被测 SHA,
          # 生产 gate 之后能按这个 SHA 反查 testing 部署结论
          echo ">>> 触发 CD workflow (testing), ref=$GITHUB_REF_NAME sha=$GITHUB_SHA"
          gh workflow run cd.yml \
            --ref "$GITHUB_REF_NAME" \
            -f ref="$GITHUB_SHA" \
            -f environment=testing
          echo "✅ CD workflow 已触发 (env: testing)"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**已触发 testing 冒烟部署 (commit: \`$GITHUB_SHA\`)**" >> "$GITHUB_STEP_SUMMARY"
