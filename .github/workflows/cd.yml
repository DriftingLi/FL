name: CD - 持续部署

on:
  # CI 通过后由 ci-summary job 主动调用 workflow_dispatch 触发（确保部署的是已测试的代码）
  # 不再使用 workflow_run 被动触发:被取消的 CI 也会触发 workflow_run(conclusion=cancelled),
  # 导致 CD 先失败一次;且短时间内多次 CI 完成时 workflow_run 事件可能被 GitHub 去重抑制,
  # 导致成功的 CI 不再触发 CD。
  workflow_dispatch:
    inputs:
      # 触发 CD 的 commit SHA(由 ci-summary 传入,确保部署的就是 CI 验证过的代码)
      ref:
        description: 部署的 commit SHA(由 CI 自动传入,留空则用默认分支 HEAD)
        type: string
        default: ""
      environment:
        description: 部署目标环境
        type: choice
        default: staging
        options:
          - staging
          - testing
          - production
      skip_backend:
        description: 跳过后端部署
        type: boolean
        default: false
      skip_frontend:
        description: 跳过前端部署
        type: boolean
        default: false
      skip_migration:
        description: 跳过数据库迁移
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ github.repository }}-frontend
  IMAGE_LIBREOFFICE: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ github.repository }}-libreoffice
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/forklift-training' }}
  COMPOSE_FILE: ${{ vars.COMPOSE_FILE || 'docker-compose.prod.yml' }}
  # 部署的 commit SHA:
  # - workflow_dispatch 触发时优先用 inputs.ref(CI 传入),否则用当前分支 HEAD
  # - CI 主动触发 CD 时会显式传入 ref=触发 CI 的 commit,确保部署的就是 CI 验证过的代码
  DEPLOY_REF: ${{ inputs.ref || github.sha }}

jobs:
  # ============================================================
  # Stage 1: 构建后端 Docker 镜像并推送 ghcr.io
  # ============================================================
  build-backend:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_backend) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ env.DEPLOY_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 检出 CI 验证过的那个 commit(inputs.ref 优先,否则当前 HEAD)
          ref: ${{ env.DEPLOY_REF }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short
            type=raw,value=${{ env.DEPLOY_REF }}
            type=ref,event=branch

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  # ============================================================
  # Stage 1.5: 构建前端 Docker 镜像并推送 ghcr.io（与后端并行）
  # ============================================================
  build-frontend:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_frontend) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ env.DEPLOY_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short
            type=raw,value=${{ env.DEPLOY_REF }}
            type=ref,event=branch

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  # ============================================================
  # Stage 1.6: 构建 LibreOffice sidecar 镜像并推送（与前端并行）
  # 拆分自 backend，使 backend 镜像从 ~500MB 减小到 ~50MB
  # ============================================================
  build-libreoffice:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ env.DEPLOY_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LIBREOFFICE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short
            type=raw,value=${{ env.DEPLOY_REF }}
            type=ref,event=branch

      - name: 构建并推送 LibreOffice sidecar 镜像
        uses: docker/build-push-action@v6
        with:
          context: libreoffice-sidecar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  # ============================================================
  # Stage 2: 通过公网 SSH 部署全栈到自托管服务器
  # ============================================================
  deploy:
    needs: [build-backend, build-frontend, build-libreoffice]
    if: |
      always() &&
      needs.build-backend.result == 'success' &&
      needs.build-frontend.result == 'success' &&
      needs.build-libreoffice.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
    env:
      # 镜像信息（来自 build-backend/build-frontend/build-libreoffice outputs）
      IMAGE_TAG: ${{ needs.build-backend.outputs.image_tag || github.sha }}
      # 注:job 级 env 块不能引用 workflow 级 env,必须内联 vars 表达式
      IMAGE_LIBREOFFICE: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ github.repository }}-libreoffice
      # SSL 证书内容（从 GitHub Secrets 注入，部署时写入服务器固定路径）
      SSL_FULLCHAIN: ${{ secrets.SSL_FULLCHAIN }}
      SSL_PRIVKEY: ${{ secrets.SSL_PRIVKEY }}
      # 残值评估
      VALUATION_JWT_SECRET_KEY: ${{ secrets.VALUATION_JWT_SECRET_KEY }}
      # 域名（启动时 envsubst 替换 nginx 配置中的 ${DOMAIN}）
      DOMAIN: ${{ secrets.DOMAIN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 数据库
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      # 密钥
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_EXPIRES_HOURS: ${{ secrets.JWT_EXPIRES_HOURS || '24' }}
      # 默认账号
      ADMIN_DEFAULT_PASSWORD: ${{ secrets.ADMIN_DEFAULT_PASSWORD }}
      TUTOR_DEFAULT_PASSWORD: ${{ secrets.TUTOR_DEFAULT_PASSWORD }}
      STUDENT_DEFAULT_PASSWORD: ${{ secrets.STUDENT_DEFAULT_PASSWORD }}
      # CORS
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      # AI 配置
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      ZHIPU_BASE_URL: ${{ secrets.ZHIPU_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
      ZHIPU_MODEL: ${{ secrets.ZHIPU_MODEL || 'glm-4.7-flash' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Coze 配置
      COZE_PROJECT_ID: ${{ secrets.COZE_PROJECT_ID }}
      COZE_OAUTH_APP_ID: ${{ secrets.COZE_OAUTH_APP_ID }}
      COZE_OAUTH_KID: ${{ secrets.COZE_OAUTH_KID }}
      COZE_OAUTH_PRIVATE_KEY: ${{ secrets.COZE_OAUTH_PRIVATE_KEY }}
      COZE_OAUTH_PRIVATE_KEY_PATH: ${{ secrets.COZE_OAUTH_PRIVATE_KEY_PATH }}
      # 部署选项
      SKIP_MIGRATION: ${{ inputs.skip_migration || 'false' }}
      # Redis 缓存
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
      REDIS_DB: ${{ secrets.REDIS_DB || '0' }}
      REDIS_POOL_SIZE: ${{ secrets.REDIS_POOL_SIZE || '10' }}
      REDIS_KEY_PREFIX: ${{ secrets.REDIS_KEY_PREFIX || 'fl:' }}
      # backend 宿主机映射端口（staging 默认 8080；testing 用 18080 避免与 cadvisor 冲突）
      BACKEND_HOST_PORT: ${{ secrets.BACKEND_HOST_PORT || '8080' }}
      # 异地备份（staging: pve-02 → pve-01；testing: 留空跳过）
      BACKUP_REMOTE_HOST: ${{ secrets.BACKUP_REMOTE_HOST }}
      BACKUP_REMOTE_DIR: ${{ secrets.BACKUP_REMOTE_DIR || '/opt/forklift-backups' }}
      BACKUP_REMOTE_KEY: ${{ secrets.BACKUP_REMOTE_KEY || '/root/.ssh/pve01-sync' }}
      # SSH 连接（公网 IP）
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '2222' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      # SSH 跳板配置（仅 testing 环境使用）
      # staging: SSH_HOST=pve-02公网, 直连
      # testing: SSH_HOST=pve-02公网(跳板), SSH_JUMP_HOST=pve-01内网
      SSH_JUMP_HOST: ${{ secrets.SSH_JUMP_HOST || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      # --------------------------------------------------------
      # Step 2.1: 配置 SSH
      #   staging: 直连 pve-02 (SSH_HOST:SSH_PORT)
      #   testing: 通过 pve-02 跳板到 pve-01 (SSH_HOST=跳板, SSH_JUMP_HOST=目标)
      # --------------------------------------------------------
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" \
            -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ -n "$SSH_JUMP_HOST" ]; then
            # testing 环境: 通过跳板访问 pve-01
            cat > ~/.ssh/config << EOF
          Host jump
              HostName $SSH_HOST
              Port $SSH_PORT
              User $SSH_USER
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no

          Host target
              HostName $SSH_JUMP_HOST
              User $SSH_USER
              IdentityFile ~/.ssh/deploy_key
              ProxyJump jump
              StrictHostKeyChecking no
          EOF
            echo "SSH_TARGET=target" >> $GITHUB_ENV
            echo "SSH_PORT_OPT=" >> $GITHUB_ENV
            echo "SSH 配置: 跳板模式 (jump=$SSH_HOST:$SSH_PORT → target=$SSH_JUMP_HOST)"
          else
            # staging 环境: 直连 pve-02
            cat > ~/.ssh/config << EOF
          Host target
              HostName $SSH_HOST
              Port $SSH_PORT
              User $SSH_USER
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
          EOF
            echo "SSH_TARGET=target" >> $GITHUB_ENV
            echo "SSH_PORT_OPT=" >> $GITHUB_ENV
            echo "SSH 配置: 直连模式 ($SSH_HOST:$SSH_PORT)"
          fi

      # --------------------------------------------------------
      # Step 2.2: 上传部署脚本和配置
      # --------------------------------------------------------
      - name: 上传部署脚本和配置
        run: |
          # 主部署文件：脚本 + compose
          scp -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            scripts/deploy-remote.sh docker-compose.prod.yml \
            "target:$DEPLOY_PATH/"

          # nginx-host.conf 必须放在 $DEPLOY_PATH/frontend/ 下（compose volume 挂载路径）
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "target" \
            "mkdir -p $DEPLOY_PATH/frontend"

          scp -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            frontend/nginx-host.conf \
            "target:$DEPLOY_PATH/frontend/nginx-host.conf"

          ssh -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "target" \
            "chmod +x $DEPLOY_PATH/deploy-remote.sh"

      # --------------------------------------------------------
      # Step 2.3: 生成环境变量文件并执行远程部署
      #           用 printf %q 安全转义所有特殊字符
      # --------------------------------------------------------
      - name: 生成环境变量文件并执行远程部署
        run: |
          # 用 printf %q 生成安全转义的环境变量文件
          # %q 会自动处理换行、引号、$ 等特殊字符，比 sed 替换安全得多
          {
            echo '#!/bin/bash'
            echo '# 由 GitHub Actions CD 自动生成 — 请勿手动编辑'
            echo "# 生成时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ''
            printf 'export IMAGE_TAG=%q\n' "${IMAGE_TAG:-latest}"
            printf 'export IMAGE_BACKEND=%q\n' "${IMAGE_BACKEND:-}"
            printf 'export IMAGE_FRONTEND=%q\n' "${IMAGE_FRONTEND:-}"
            printf 'export IMAGE_LIBREOFFICE=%q\n' "${IMAGE_LIBREOFFICE:-}"
            printf 'export SSL_FULLCHAIN=%q\n' "${SSL_FULLCHAIN:-}"
            printf 'export SSL_PRIVKEY=%q\n' "${SSL_PRIVKEY:-}"
            printf 'export DOMAIN=%q\n' "${DOMAIN:-}"
            printf 'export GITHUB_TOKEN=%q\n' "${GITHUB_TOKEN:-}"
            printf 'export REGISTRY=%q\n' "${REGISTRY:-ghcr.io}"
            printf 'export DATABASE_URL=%q\n' "${DATABASE_URL:-}"
            printf 'export DB_USER=%q\n' "${DB_USER:-forklift}"
            printf 'export DB_PASSWORD=%q\n' "${DB_PASSWORD:-}"
            printf 'export SECRET_KEY=%q\n' "${SECRET_KEY:-}"
            printf 'export JWT_SECRET_KEY=%q\n' "${JWT_SECRET_KEY:-}"
            printf 'export JWT_EXPIRES_HOURS=%q\n' "${JWT_EXPIRES_HOURS:-24}"
            printf 'export ADMIN_DEFAULT_PASSWORD=%q\n' "${ADMIN_DEFAULT_PASSWORD:-}"
            printf 'export TUTOR_DEFAULT_PASSWORD=%q\n' "${TUTOR_DEFAULT_PASSWORD:-}"
            printf 'export STUDENT_DEFAULT_PASSWORD=%q\n' "${STUDENT_DEFAULT_PASSWORD:-}"
            printf 'export CORS_ORIGINS=%q\n' "${CORS_ORIGINS:-}"
            printf 'export VALUATION_JWT_SECRET_KEY=%q\n' "${VALUATION_JWT_SECRET_KEY:-}"
            printf 'export COMPOSE_FILE=%q\n' "${COMPOSE_FILE:-docker-compose.prod.yml}"
            printf 'export DEPLOY_PATH=%q\n' "${DEPLOY_PATH:-/opt/forklift-training}"
            printf 'export SKIP_MIGRATION=%q\n' "${SKIP_MIGRATION:-false}"
            printf 'export REDIS_PASSWORD=%q\n' "${REDIS_PASSWORD:-}"
            printf 'export REDIS_DB=%q\n' "${REDIS_DB:-0}"
            printf 'export REDIS_POOL_SIZE=%q\n' "${REDIS_POOL_SIZE:-10}"
            printf 'export REDIS_KEY_PREFIX=%q\n' "${REDIS_KEY_PREFIX:-fl:}"
            printf 'export BACKUP_REMOTE_HOST=%q\n' "${BACKUP_REMOTE_HOST:-}"
            printf 'export BACKUP_REMOTE_DIR=%q\n' "${BACKUP_REMOTE_DIR:-}"
            printf 'export BACKUP_REMOTE_KEY=%q\n' "${BACKUP_REMOTE_KEY:-}"
            printf 'export BACKEND_HOST_PORT=%q\n' "${BACKEND_HOST_PORT:-8080}"
          } > /tmp/deploy-env.sh

          echo "环境变量文件已生成（$(wc -l < /tmp/deploy-env.sh) 行）"
          echo "注意：密钥值已被 GitHub Actions 自动 mask，不会出现在日志中"

          # 上传环境变量文件
          scp -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            /tmp/deploy-env.sh \
            "target:/tmp/deploy-env.sh"

          # 执行远程部署
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "target" \
            "set -e; source /tmp/deploy-env.sh; shred -u /tmp/deploy-env.sh 2>/dev/null || rm -f /tmp/deploy-env.sh; cd \"\$DEPLOY_PATH\" && bash deploy-remote.sh"

      # --------------------------------------------------------
      # Step 2.4: 清理
      # --------------------------------------------------------
      - name: 清理 SSH 密钥
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key /tmp/deploy-env.sh

  # ============================================================
  # Stage 6: 部署汇总
  # ============================================================
  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总部署状态
        run: |
          DEPLOY_STATUS="${{ needs.deploy.result }}"

          echo "# 部署报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 全栈部署 (公网 SSH) | $([ "$DEPLOY_STATUS" = 'success' ] && echo '✅' || ([ "$DEPLOY_STATUS" = 'skipped' ] && echo '⏭️') || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端 | $([ "$DEPLOY_STATUS" = 'success' ] && echo '✅ 已部署' || echo '⚠️') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 后端 API: ${{ vars.API_URL || '未配置' }}" >> $GITHUB_STEP_SUMMARY
          echo "- 前端: ${{ vars.FRONTEND_URL || '未配置' }}" >> $GITHUB_STEP_SUMMARY
        shell: bash
