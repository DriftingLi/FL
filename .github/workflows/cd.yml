name: CD - 持续部署

on:
  # 1) master 合并（push）→ 直发 production。不重跑 CI,由 gate job 校验来源 PR 的
  #    ci-summary 结论与 testing 冒烟部署结论（见 jobs.gate）。
  push:
    branches: [master]
  # 2) 分支 CI 全绿后由 ci.yml 的 ci-summary job 主动 workflow_dispatch 触发 testing;
  #    也可人工 dispatch（应急放行生产时 environment=production,天然跳过 gate 校验）。
  #    不用 workflow_run 被动触发:被取消的 CI 也会触发 workflow_run(conclusion=cancelled),
  #    导致 CD 先失败一次;且短时间内多次 CI 完成时 workflow_run 事件可能被 GitHub 去重抑制。
  workflow_dispatch:
    inputs:
      # 触发 CD 的 commit SHA(由 ci-summary 传入,确保部署的就是 CI 验证过的代码)
      ref:
        description: 部署的 commit SHA(由 CI 自动传入,留空则用默认分支 HEAD)
        type: string
        default: ""
      environment:
        description: 部署目标环境
        type: choice
        default: production
        options:
          - production
          - testing
      skip_backend:
        description: 跳过后端部署
        type: boolean
        default: false
      skip_frontend:
        description: 跳过前端部署
        type: boolean
        default: false
      skip_migration:
        description: 跳过数据库迁移
        type: boolean
        default: false

concurrency:
  # 同一环境同时只允许一条部署（串行，避免部署互相抢占 Docker 资源/竞争 .env）。
  # 按「解析后的环境名」分组：push 事件下 inputs.environment 为空,必须回退到
  # github.ref 判断,否则生产部署会落进 cd- 组,与人工 dispatch 的 cd-production 不互斥
  # （曾致两条 production CD 并发竞争 .env.tmp，.env 丢失后 compose 回退 Docker Hub
  # 默认镜像名拉取超时，栈停机）。
  # 不同环境（testing / production 两台机器）分属不同组,互不阻塞。
  # 代价：卡死的 run 会阻塞同环境后续部署,需手动 cancel（github.com/*/actions 页面）。
  group: cd-${{ inputs.environment || (github.ref == 'refs/heads/master' && 'production' || 'testing') }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ github.repository }}-frontend
  IMAGE_LIBREOFFICE: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ github.repository }}-libreoffice
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/forklift-training' }}
  COMPOSE_FILE: ${{ vars.COMPOSE_FILE || 'docker-compose.prod.yml' }}
  # 部署的 commit SHA:
  # - workflow_dispatch 触发时优先用 inputs.ref(CI 传入),否则用当前分支 HEAD
  # - CI 主动触发 CD 时会显式传入 ref=触发 CI 的 commit,确保部署的就是 CI 验证过的代码
  DEPLOY_REF: ${{ inputs.ref || github.sha }}

jobs:
  # ============================================================
  # Stage 0: 解析部署目标 + 生产门禁
  #   push master        → environment=production,并校验来源 PR 的 CI 与 testing 冒烟
  #   workflow_dispatch  → environment=inputs.environment,人工授权,不经门禁(应急通道)
  #
  #   为什么必须有门禁:squash 合并在 master 上生成的是从未跑过 CI 的新 SHA,
  #   「PR 分支的 head SHA 测过」与「master 的 commit 测过」只能靠回查 PR 对齐。
  #   配合 ruleset 的必检 ci-summary + 要求分支 up-to-date,保证测过的树 == 合入的树。
  # ============================================================
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - name: 解析目标环境
        id: target
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "master push → production(需过门禁)"
            exit 0
          fi

          echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          echo "dispatch → ${{ inputs.environment }}(人工/CI 触发,不经门禁)"

          # 冒烟证据必须与内容严格对应：workflow_dispatch 的 --ref 只能是分支名,
          # run 的 head_sha 取「派发那一刻的分支 tip」,而被部署的内容是 inputs.ref。
          # 若两者不同（CI 跑完后分支又前进了）,部署记录会把「旧内容的测试」记到
          # 「新 SHA」头上,生产 gate 就会被这份假证据放行。此处直接失败,
          # 由新 tip 自己的 CI 重新派发一份真实冒烟。
          if [ "${{ inputs.environment }}" = "testing" ] && [ -n "${{ inputs.ref }}" ] \
             && [ "${{ inputs.ref }}" != "$GITHUB_SHA" ]; then
            echo "::error::inputs.ref=${{ inputs.ref }} 与本 run head_sha=$GITHUB_SHA 不一致：分支在 CI 与派发之间前进过,拒绝生成错位的冒烟记录（等最新 CI 重新派发即可）"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 1

      - name: 校验来源 PR 的 CI 与 testing 冒烟
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MANUAL="手动 dispatch cd.yml(environment=production, ref=$GITHUB_SHA)"

          SUBJECT=$(git log -1 --pretty=%s)
          PR=$(printf '%s' "$SUBJECT" | grep -oE '\(#[0-9]+\)$' | tr -dc '0-9' || true)
          if [ -z "$PR" ]; then
            echo "::error::无法从 commit 主题解析 PR 号:[$SUBJECT]。squash 合并默认带 (#N) 后缀;确需放行请$MANUAL"
            exit 1
          fi

          # 独立赋值以便 set -e 捕获 gh 调用失败（放进 read 的替换里会被 read 的退出码吞掉）
          TSV=$(gh pr view "$PR" --json state,headRefOid,mergeCommit \
                  --jq '[.state, .headRefOid, .mergeCommit.oid] | @tsv')
          IFS=$'\t' read -r PSTATE SHA MERGE <<EOF
          $TSV
          EOF
          echo ">>> PR #$PR state=$PSTATE head=$SHA merge=$MERGE"
          [ "$PSTATE" = "MERGED" ] || { echo "::error::PR #$PR 状态为 $PSTATE,非 MERGED"; exit 1; }
          if [ "$MERGE" != "$GITHUB_SHA" ]; then
            echo "::error::PR #$PR 的 merge commit 与本次部署 HEAD 不一致(可能有多个 commit 一起进 master),请对每个 PR 单独 $MANUAL"
            exit 1
          fi

          # 1) CI 结论:同一 SHA 可能有多条 ci-summary 记录(旧版 push+pull_request 双跑),
          #    按「任一 failure 即失败 / 有 success 即通过」聚合,避免 head -1 取到 skipped 误判
          CI=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --jq '
            [.check_runs[] | select(.name=="ci-summary") | .conclusion]
            | if any(. == "failure") then "failure"
              elif any(. == "success") then "success"
              elif length == 0 then "missing"
              else "other" end')
          if [ "$CI" != "success" ]; then
            echo "::error::PR #$PR head $SHA 的 ci-summary 结论为 $CI,阻断生产部署"
            echo "    missing/other 通常说明该分支跑的还是旧版流水线(ci-summary 仅 master 上报),merge master 后重推分支即可"
            echo "    确需放行请$MANUAL"
            exit 1
          fi

          # 2) testing 冒烟:部署记录在 CD 的 deploy job 启动时才创建,而合并可能早于冒烟结束,
          #    故轮询等待(上限 8 分钟);冒烟明确失败则立即阻断,不再白等。
          #    8 分钟 = testing 冒烟正常耗时(2~3 分钟)的近 3 倍余量。曾放宽到 15 分钟,
          #    结果 pve-01 deploy 卡死时 gate 白白陪等 15 分钟才阻断(2026-09-04 两次事故)。
          #    聚合一律下推到 --jq（避免 `| head -1` 在 pipefail 下因 SIGPIPE 误杀步骤）;
          #    瞬时 API 失败按「未就绪」处理继续轮询,不直接判死。
          DEADLINE=$(( $(date +%s) + 480 ))
          while :; do
            DEP_ID=$(gh api "repos/$GITHUB_REPOSITORY/deployments?per_page=100" \
                       --jq "[.[] | select(.sha==\"$SHA\" and .environment==\"testing\")] | (.[0].id // empty)" || true)
            STATE=""
            if [ -n "$DEP_ID" ]; then
              STATE=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEP_ID/statuses" \
                        --jq 'if length == 0 then "none" else (sort_by(.created_at) | last | .state) end' || true)
            fi
            case "$STATE" in
              success)
                echo "✅ testing 冒烟通过(deployment $DEP_ID)"
                break ;;
              failure|error)
                echo "::error::commit $SHA 的 testing 冒烟为 $STATE,阻断生产部署"
                echo "    出口 A:到 Actions 重跑该分支的 testing CD run,通过后重新合并"
                echo "    出口 B:确认无需冒烟时$MANUAL"
                exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::等不到 commit $SHA 的 testing 冒烟成功(deployment=${DEP_ID:-无记录} 状态=${STATE:-未知}),阻断生产部署"
              if [ -z "$DEP_ID" ]; then
                echo "    无部署记录多半是「分支 CI 变绿时还没有开 PR」造成的(ci-summary 只在有 open PR 时派发冒烟)。"
                echo "    出口 A:到 Actions 重跑该分支的 CI run → ci-summary 会补发 testing 冒烟"
              else
                echo "    出口 A:到 Actions 重跑该分支的 testing CD run"
              fi
              echo "    出口 B:冒烟通过后(或确认无需冒烟时)$MANUAL"
              exit 1
            fi
            echo "testing 冒烟未就绪(deployment=${DEP_ID:-无记录} 状态=${STATE:-未知}),30s 后重试..."
            sleep 30
          done

          echo "✅ 门禁通过:PR #$PR / ci-summary=success / testing 冒烟=success"
          echo "| 门禁 | PR #$PR · ci-summary ✅ · testing 冒烟 ✅ |" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # Stage 1: 构建后端 Docker 镜像并推送 ghcr.io
  # ============================================================
  build-backend:
    needs: gate
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_backend) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.content.outputs.content_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 检出 CI 验证过的那个 commit(inputs.ref 优先,否则当前 HEAD)
          ref: ${{ env.DEPLOY_REF }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 内容哈希标签：构建上下文树未变 → 远端已有该标签 → 跳过构建/推送（部署也跳过拉取）
      - name: 计算内容标签并检查远端是否已存在
        id: content
        run: |
          CONTENT_TAG="c$(git ls-tree HEAD -- backend/ | git hash-object --stdin | cut -c1-16)"
          echo "content_tag=${CONTENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_BACKEND,,}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${IMAGE_BACKEND,,}:${CONTENT_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "后端内容未变更（${CONTENT_TAG} 已存在），跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 提取镜像标签
        if: steps.content.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}

          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short
            type=raw,value=${{ env.DEPLOY_REF }}
            type=ref,event=branch

      - name: 构建并推送后端镜像
        if: steps.content.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.content.outputs.image_ref }}:${{ steps.content.outputs.content_tag }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  # ============================================================
  # Stage 1.5: 构建前端 Docker 镜像并推送 ghcr.io（与后端并行）
  # ============================================================
  build-frontend:
    needs: gate
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_frontend) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.content.outputs.content_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 内容哈希标签：构建上下文树未变 → 远端已有该标签 → 跳过构建/推送（部署也跳过拉取）
      - name: 计算内容标签并检查远端是否已存在
        id: content
        run: |
          CONTENT_TAG="c$(git ls-tree HEAD -- frontend/ | git hash-object --stdin | cut -c1-16)"
          echo "content_tag=${CONTENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_FRONTEND,,}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${IMAGE_FRONTEND,,}:${CONTENT_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "前端内容未变更（${CONTENT_TAG} 已存在），跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 提取镜像标签
        if: steps.content.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}

          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short
            type=raw,value=${{ env.DEPLOY_REF }}
            type=ref,event=branch

      - name: 构建并推送前端镜像
        if: steps.content.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.content.outputs.image_ref }}:${{ steps.content.outputs.content_tag }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  # ============================================================
  # Stage 1.6: 构建 LibreOffice sidecar 镜像并推送（与前端并行）
  # 拆分自 backend，使 backend 镜像从 ~500MB 减小到 ~50MB
  # ============================================================
  build-libreoffice:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.content.outputs.content_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 内容哈希标签：构建上下文树未变 → 远端已有该标签 → 跳过构建/推送（部署也跳过拉取）
      - name: 计算内容标签并检查远端是否已存在
        id: content
        run: |
          CONTENT_TAG="c$(git ls-tree HEAD -- libreoffice-sidecar/ | git hash-object --stdin | cut -c1-16)"
          echo "content_tag=${CONTENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_LIBREOFFICE,,}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${IMAGE_LIBREOFFICE,,}:${CONTENT_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "LibreOffice 内容未变更（${CONTENT_TAG} 已存在），跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 提取镜像标签
        if: steps.content.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LIBREOFFICE }}

          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short
            type=raw,value=${{ env.DEPLOY_REF }}
            type=ref,event=branch

      - name: 构建并推送 LibreOffice sidecar 镜像
        if: steps.content.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: libreoffice-sidecar
          push: true
          tags: |
            ${{ steps.content.outputs.image_ref }}:${{ steps.content.outputs.content_tag }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  # ============================================================
  # Stage 2: 通过公网 SSH 部署全栈到自托管服务器
  # ============================================================
  deploy:
    needs: [gate, build-backend, build-frontend, build-libreoffice]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      needs.build-backend.result == 'success' &&
      needs.build-frontend.result == 'success' &&
      needs.build-libreoffice.result == 'success'
    runs-on: ubuntu-latest
    # fail-fast 兜底：deploy 的 SSH 远程执行曾两次在 pve-01 上卡死 17+ 分钟
    # （docker daemon/镜像拉取挂起，脚本内各命令虽各有超时但没有整体兜底），
    # 拖死 gate 的 15 分钟轮询。testing 正常 2~3 分钟、production 正常 5~11 分钟。
    timeout-minutes: ${{ needs.gate.outputs.environment == 'testing' && 12 || 30 }}
    environment:
      # 环境名统一由 gate 解析(push→production / dispatch→inputs)，
      # 保证 push 事件下 inputs.environment 为空时也能正确落到 production
      name: ${{ needs.gate.outputs.environment }}
    env:
      # 镜像信息（来自 build-backend/build-frontend/build-libreoffice outputs：
      # 内容哈希标签，未变更的镜像跳过构建/拉取；缺失时回退 commit SHA）
      IMAGE_TAG: ${{ needs.build-backend.outputs.image_tag || github.sha }}
      IMAGE_TAG_BACKEND: ${{ needs.build-backend.outputs.image_tag || github.sha }}
      IMAGE_TAG_FRONTEND: ${{ needs.build-frontend.outputs.image_tag || github.sha }}
      IMAGE_TAG_LIBREOFFICE: ${{ needs.build-libreoffice.outputs.image_tag || github.sha }}
      # 注:job 级 env 块不能引用 workflow 级 env,必须内联 vars 表达式
      IMAGE_LIBREOFFICE: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ github.repository }}-libreoffice
      # 镜像加速代理（ghcr pull-through 缓存，如 127.0.0.1:5000；留空则直连 ghcr.io）
      # 在仓库级 Variables 设置 REGISTRY_PROXY=127.0.0.1:5000，所有环境统一生效
      # 多节点共享缓存：REGISTRY_PROXY 指向缓存节点内网地址（如 172.17.1.41:5000），
      # 缓存节点自身经 REGISTRY_PROXY_BIND 监听内网；其余节点直接内网拉取
      REGISTRY_PROXY: ${{ vars.REGISTRY_PROXY || '' }}
      REGISTRY_PROXY_BIND: ${{ vars.REGISTRY_PROXY_BIND || '127.0.0.1' }}
      # 旧版本镜像保留数量（部署后清理更早版本；可在仓库级 Variables 中覆盖）
      KEEP_IMAGES: ${{ vars.KEEP_IMAGES || '3' }}
      # SSL 证书内容（从 GitHub Secrets 注入，部署时写入服务器固定路径）
      SSL_FULLCHAIN: ${{ secrets.SSL_FULLCHAIN }}
      SSL_PRIVKEY: ${{ secrets.SSL_PRIVKEY }}
      # 域名（启动时 envsubst 替换 nginx 配置中的 ${DOMAIN}）
      DOMAIN: ${{ secrets.DOMAIN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 数据库
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      # 密钥
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_EXPIRES_HOURS: ${{ secrets.JWT_EXPIRES_HOURS || '2' }}
      JWT_REFRESH_EXPIRES_DAYS: ${{ secrets.JWT_REFRESH_EXPIRES_DAYS || '7' }}
      # 登录态 Cookie（父域名共享登录；production 走 HTTPS 时 Secure=true）
      AUTH_COOKIE_NAME: ${{ secrets.AUTH_COOKIE_NAME || 'hrwai_token' }}
      AUTH_COOKIE_DOMAIN: ${{ secrets.AUTH_COOKIE_DOMAIN }}
      AUTH_COOKIE_SECURE: ${{ needs.gate.outputs.environment == 'production' && 'true' || 'false' }}
      # SMTP 邮件（验证码通道；腾讯企业邮 SSL 465）
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || secrets.SMTP_FROM }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME || '和润天下' }}
      # 腾讯云短信（手机验证码通道；SecretId/SecretKey 为云 API 密钥 cam/capi，非控制台 AppKey）
      TENCENT_SMS_SECRET_ID: ${{ secrets.TENCENT_SMS_SECRET_ID }}
      TENCENT_SMS_SECRET_KEY: ${{ secrets.TENCENT_SMS_SECRET_KEY }}
      TENCENT_SMS_SDK_APP_ID: ${{ secrets.TENCENT_SMS_SDK_APP_ID }}
      TENCENT_SMS_SIGN_NAME: ${{ secrets.TENCENT_SMS_SIGN_NAME }}
      TENCENT_SMS_TEMPLATE_REGISTER: ${{ secrets.TENCENT_SMS_TEMPLATE_REGISTER }}
      TENCENT_SMS_TEMPLATE_LOGIN: ${{ secrets.TENCENT_SMS_TEMPLATE_LOGIN }}
      TENCENT_SMS_TEMPLATE_PASSWORD: ${{ secrets.TENCENT_SMS_TEMPLATE_PASSWORD }}
      TENCENT_SMS_TEMPLATE_BIND_PHONE: ${{ secrets.TENCENT_SMS_TEMPLATE_BIND_PHONE }}
      TENCENT_SMS_REGION: ${{ secrets.TENCENT_SMS_REGION || 'ap-guangzhou' }}
      # 微信登录凭证（小程序 code2session / 开放平台扫码占位——两套凭证严格区分）
      WECHAT_MINI_PROGRAM_APP_ID: ${{ secrets.WECHAT_MINI_PROGRAM_APP_ID || secrets.WECHAT_APP_ID }}
      WECHAT_MINI_PROGRAM_APP_SECRET: ${{ secrets.WECHAT_MINI_PROGRAM_APP_SECRET || secrets.WECHAT_APP_SECRET }}
      WECHAT_OPEN_PLATFORM_APP_ID: ${{ secrets.WECHAT_OPEN_PLATFORM_APP_ID }}
      WECHAT_OPEN_PLATFORM_APP_SECRET: ${{ secrets.WECHAT_OPEN_PLATFORM_APP_SECRET }}
      # 默认账号
      ADMIN_DEFAULT_PASSWORD: ${{ secrets.ADMIN_DEFAULT_PASSWORD }}
      TUTOR_DEFAULT_PASSWORD: ${{ secrets.TUTOR_DEFAULT_PASSWORD }}
      STUDENT_DEFAULT_PASSWORD: ${{ secrets.STUDENT_DEFAULT_PASSWORD }}
      # CORS
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      # 部署选项
      SKIP_MIGRATION: ${{ inputs.skip_migration || 'false' }}
      # Redis 缓存
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
      REDIS_DB: ${{ secrets.REDIS_DB || '0' }}
      REDIS_POOL_SIZE: ${{ secrets.REDIS_POOL_SIZE || '20' }}
      REDIS_KEY_PREFIX: ${{ secrets.REDIS_KEY_PREFIX || 'fl:' }}
      # Cloudflare R2 对象存储（留空则回退到本地磁盘 STORAGE_DRIVER=local）
      STORAGE_DRIVER: ${{ secrets.STORAGE_DRIVER || 'local' }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || '' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
      # Swagger 文档（C 方案：旗标 + BasicAuth；prod 默认 false，线上临时开启需同时注入 USER/PASS）
      SWAGGER_ENABLED: ${{ secrets.SWAGGER_ENABLED || vars.SWAGGER_ENABLED || 'false' }}
      SWAGGER_USER: ${{ secrets.SWAGGER_USER }}
      SWAGGER_PASS: ${{ secrets.SWAGGER_PASS }}
      # backend 宿主机映射端口（production 默认 8080；testing 固定 18080）
      BACKEND_HOST_PORT: ${{ secrets.BACKEND_HOST_PORT || '8080' }}
      # 异地备份（production: pve-02 → pve-01；testing: 留空跳过）
      BACKUP_REMOTE_HOST: ${{ secrets.BACKUP_REMOTE_HOST }}
      BACKUP_REMOTE_DIR: ${{ secrets.BACKUP_REMOTE_DIR || '/opt/forklift-backups' }}
      BACKUP_REMOTE_KEY: ${{ secrets.BACKUP_REMOTE_KEY || '/root/.ssh/pve01-sync' }}
      # SSH 连接（公网 IP 直连 PVE 宿主机）
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '2222' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      # SSH 跳板配置：两环境均直连 PVE 宿主机，无跳板（SSH_JUMP_HOST 已删除，留空走直连分支）
      # production: 183.36.195.104:2222 → pve-02 宿主机
      # testing:    183.36.195.104:2201 → pve-01 宿主机（ISP 侧端口映射）
      # ProxyJump 代码分支保留，供未来需要跳板时经 SSH_JUMP_HOST 重新启用
      SSH_JUMP_HOST: ${{ secrets.SSH_JUMP_HOST || '' }}
      # Volume 路径：两环境均在 PVE 宿主机直接运行 Docker 26+，named volume 正常工作
      # 留空 → deploy-remote.sh 默认使用 named volume（pgdata-prod / redisdata-prod 等）
      # Ceph 化后可在 environment secret 配置（如 PG_VOLUME=/srv/ceph/pgdata 指向 RBD 挂载点）
      PG_VOLUME: ${{ secrets.PG_VOLUME || '' }}
      REDIS_VOLUME: ${{ secrets.REDIS_VOLUME || '' }}
      UPLOADS_VOLUME: ${{ secrets.UPLOADS_VOLUME || '' }}
      REPORTS_VOLUME: ${{ secrets.REPORTS_VOLUME || '' }}
      # ===== testing 加速参数（按环境注入,环境名取自 gate outputs 以兼容 push 事件）=====
      # testing 跳过部署期 pg_dump 备份（回滚保障由 RBD 快照+每日备份承担）
      SKIP_BACKUP: ${{ needs.gate.outputs.environment == 'testing' && 'true' || 'false' }}
      # testing 不启用 libreoffice profile（省 500MB 镜像传输）；production 必须 full
      COMPOSE_PROFILES: ${{ needs.gate.outputs.environment == 'production' && 'full' || '' }}
      # testing 缩短健康检查轮询与 compose --wait 超时，快速通过即停容器
      HEALTH_CHECK_RETRIES: ${{ needs.gate.outputs.environment == 'testing' && '8' || '20' }}
      UP_WAIT_TIMEOUT: ${{ needs.gate.outputs.environment == 'testing' && '30' || '60' }}
      # 远程部署脚本整体超时（秒）：pve-01 上曾出现 docker 命令挂起导致 ssh 步骤
      # 卡死 17+ 分钟（脚本内各命令虽有零散超时，但没有整体兜底），拖死 gate 轮询。
      # testing 正常 2~3 分钟 → 660s 余量 3 倍+；production 正常 5~11 分钟 → 1500s。
      DEPLOY_CMD_TIMEOUT: ${{ needs.gate.outputs.environment == 'testing' && '660' || '1500' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      # --------------------------------------------------------
      # Step 2.1: 配置 SSH
      #   production/testing: 公网直连 PVE 宿主机 (SSH_HOST:SSH_PORT)
      #           production=pve-02(183.36.195.104:2222)
      #           testing=pve-01(183.36.195.104:2201, ISP 侧端口映射)
      #   若配置了 SSH_JUMP_HOST，则走 ProxyJump 跳板模式（当前两环境均未使用）
      # --------------------------------------------------------
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" \
            -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ -n "$SSH_JUMP_HOST" ]; then
            # 有跳板环境: ProxyJump (SSH_HOST 公网 → SSH_JUMP_HOST 目标)
            cat > ~/.ssh/config << EOF
          Host jump
              HostName $SSH_HOST
              Port $SSH_PORT
              User $SSH_USER
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no

          Host target
              HostName $SSH_JUMP_HOST
              User $SSH_USER
              IdentityFile ~/.ssh/deploy_key
              ProxyJump jump
              StrictHostKeyChecking no
          EOF
            echo "SSH_TARGET=target" >> $GITHUB_ENV
            echo "SSH_PORT_OPT=" >> $GITHUB_ENV
            echo "SSH 配置: 跳板模式 (jump=$SSH_HOST:$SSH_PORT → target=$SSH_JUMP_HOST)"
          else
            # 无跳板环境: 直连
            cat > ~/.ssh/config << EOF
          Host target
              HostName $SSH_HOST
              Port $SSH_PORT
              User $SSH_USER
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
          EOF
            echo "SSH_TARGET=target" >> $GITHUB_ENV
            echo "SSH_PORT_OPT=" >> $GITHUB_ENV
            echo "SSH 配置: 直连模式 ($SSH_HOST:$SSH_PORT)"
          fi

      # --------------------------------------------------------
      # Step 2.2: 上传部署脚本和配置（tar 打包单次传输，替代多次 scp 往返）
      # --------------------------------------------------------
      - name: 上传部署脚本和配置
        run: |
          # 打包：deploy-remote.sh / compose / nginx-host.conf
          tar czf /tmp/deploy-files.tar.gz \
            scripts/deploy-remote.sh \
            docker-compose.prod.yml \
            frontend/nginx-host.conf

          scp -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            /tmp/deploy-files.tar.gz \
            "target:/tmp/deploy-files.tar.gz"

          ssh -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "target" \
            "mkdir -p $DEPLOY_PATH/frontend && cd $DEPLOY_PATH && \
             tar xzf /tmp/deploy-files.tar.gz && rm -f /tmp/deploy-files.tar.gz && \
             chmod +x scripts/deploy-remote.sh"

      # --------------------------------------------------------
      # Step 2.3: 生成环境变量文件并执行远程部署
      #           用 printf %q 安全转义所有特殊字符
      # --------------------------------------------------------
      - name: 生成环境变量文件并执行远程部署
        run: |
          # 用 printf %q 生成安全转义的环境变量文件
          # %q 会自动处理换行、引号、$ 等特殊字符，比 sed 替换安全得多
          {
            echo '#!/bin/bash'
            echo '# 由 GitHub Actions CD 自动生成 — 请勿手动编辑'
            echo "# 生成时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ''
            printf 'export IMAGE_TAG=%q\n' "${IMAGE_TAG:-latest}"
            printf 'export IMAGE_TAG_BACKEND=%q\n' "${IMAGE_TAG_BACKEND:-}"
            printf 'export IMAGE_TAG_FRONTEND=%q\n' "${IMAGE_TAG_FRONTEND:-}"
            printf 'export IMAGE_TAG_LIBREOFFICE=%q\n' "${IMAGE_TAG_LIBREOFFICE:-}"
            printf 'export IMAGE_BACKEND=%q\n' "${IMAGE_BACKEND:-}"
            printf 'export IMAGE_FRONTEND=%q\n' "${IMAGE_FRONTEND:-}"
            printf 'export IMAGE_LIBREOFFICE=%q\n' "${IMAGE_LIBREOFFICE:-}"
            printf 'export SSL_FULLCHAIN=%q\n' "${SSL_FULLCHAIN:-}"
            printf 'export SSL_PRIVKEY=%q\n' "${SSL_PRIVKEY:-}"
            printf 'export DOMAIN=%q\n' "${DOMAIN:-}"
            printf 'export GITHUB_TOKEN=%q\n' "${GITHUB_TOKEN:-}"
            printf 'export REGISTRY=%q\n' "${REGISTRY:-ghcr.io}"
            printf 'export REGISTRY_PROXY=%q\n' "${REGISTRY_PROXY:-}"
            printf 'export REGISTRY_PROXY_BIND=%q\n' "${REGISTRY_PROXY_BIND:-127.0.0.1}"
            printf 'export KEEP_IMAGES=%q\n' "${KEEP_IMAGES:-3}"
            printf 'export DATABASE_URL=%q\n' "${DATABASE_URL:-}"
            printf 'export DB_USER=%q\n' "${DB_USER:-forklift}"
            printf 'export DB_PASSWORD=%q\n' "${DB_PASSWORD:-}"
            printf 'export SECRET_KEY=%q\n' "${SECRET_KEY:-}"
            printf 'export JWT_SECRET_KEY=%q\n' "${JWT_SECRET_KEY:-}"
            printf 'export JWT_EXPIRES_HOURS=%q\n' "${JWT_EXPIRES_HOURS:-2}"
            printf 'export JWT_REFRESH_EXPIRES_DAYS=%q\n' "${JWT_REFRESH_EXPIRES_DAYS:-7}"
            printf 'export AUTH_COOKIE_NAME=%q\n' "${AUTH_COOKIE_NAME:-hrwai_token}"
            printf 'export AUTH_COOKIE_DOMAIN=%q\n' "${AUTH_COOKIE_DOMAIN:-}"
            printf 'export AUTH_COOKIE_SECURE=%q\n' "${AUTH_COOKIE_SECURE:-true}"
            printf 'export ADMIN_DEFAULT_PASSWORD=%q\n' "${ADMIN_DEFAULT_PASSWORD:-}"
            printf 'export TUTOR_DEFAULT_PASSWORD=%q\n' "${TUTOR_DEFAULT_PASSWORD:-}"
            printf 'export STUDENT_DEFAULT_PASSWORD=%q\n' "${STUDENT_DEFAULT_PASSWORD:-}"
            printf 'export SMTP_HOST=%q\n' "${SMTP_HOST:-}"
            printf 'export SMTP_PORT=%q\n' "${SMTP_PORT:-465}"
            printf 'export SMTP_USERNAME=%q\n' "${SMTP_USERNAME:-${SMTP_FROM:-}}"
            printf 'export SMTP_PASSWORD=%q\n' "${SMTP_PASSWORD:-}"
            printf 'export SMTP_FROM=%q\n' "${SMTP_FROM:-}"
            printf 'export SMTP_FROM_NAME=%q\n' "${SMTP_FROM_NAME:-和润天下}"
            printf 'export TENCENT_SMS_SECRET_ID=%q\n' "${TENCENT_SMS_SECRET_ID:-}"
            printf 'export TENCENT_SMS_SECRET_KEY=%q\n' "${TENCENT_SMS_SECRET_KEY:-}"
            printf 'export TENCENT_SMS_SDK_APP_ID=%q\n' "${TENCENT_SMS_SDK_APP_ID:-}"
            printf 'export TENCENT_SMS_SIGN_NAME=%q\n' "${TENCENT_SMS_SIGN_NAME:-}"
            printf 'export TENCENT_SMS_TEMPLATE_REGISTER=%q\n' "${TENCENT_SMS_TEMPLATE_REGISTER:-}"
            printf 'export TENCENT_SMS_TEMPLATE_LOGIN=%q\n' "${TENCENT_SMS_TEMPLATE_LOGIN:-}"
            printf 'export TENCENT_SMS_TEMPLATE_PASSWORD=%q\n' "${TENCENT_SMS_TEMPLATE_PASSWORD:-}"
            printf 'export TENCENT_SMS_TEMPLATE_BIND_PHONE=%q\n' "${TENCENT_SMS_TEMPLATE_BIND_PHONE:-}"
            printf 'export TENCENT_SMS_REGION=%q\n' "${TENCENT_SMS_REGION:-ap-guangzhou}"
            printf 'export WECHAT_MINI_PROGRAM_APP_ID=%q\n' "${WECHAT_MINI_PROGRAM_APP_ID:-}"
            printf 'export WECHAT_MINI_PROGRAM_APP_SECRET=%q\n' "${WECHAT_MINI_PROGRAM_APP_SECRET:-}"
            printf 'export WECHAT_OPEN_PLATFORM_APP_ID=%q\n' "${WECHAT_OPEN_PLATFORM_APP_ID:-}"
            printf 'export WECHAT_OPEN_PLATFORM_APP_SECRET=%q\n' "${WECHAT_OPEN_PLATFORM_APP_SECRET:-}"
            printf 'export CORS_ORIGINS=%q\n' "${CORS_ORIGINS:-}"
            printf 'export COMPOSE_FILE=%q\n' "${COMPOSE_FILE:-docker-compose.prod.yml}"
            printf 'export DEPLOY_PATH=%q\n' "${DEPLOY_PATH:-/opt/forklift-training}"
            printf 'export SKIP_MIGRATION=%q\n' "${SKIP_MIGRATION:-false}"
            printf 'export REDIS_PASSWORD=%q\n' "${REDIS_PASSWORD:-}"
            printf 'export REDIS_DB=%q\n' "${REDIS_DB:-0}"
            printf 'export REDIS_POOL_SIZE=%q\n' "${REDIS_POOL_SIZE:-20}"
            printf 'export REDIS_KEY_PREFIX=%q\n' "${REDIS_KEY_PREFIX:-fl:}"
            printf 'export STORAGE_DRIVER=%q\n' "${STORAGE_DRIVER:-local}"
            printf 'export R2_ENDPOINT=%q\n' "${R2_ENDPOINT:-}"
            printf 'export R2_ACCOUNT_ID=%q\n' "${R2_ACCOUNT_ID:-}"
            printf 'export R2_ACCESS_KEY_ID=%q\n' "${R2_ACCESS_KEY_ID:-}"
            printf 'export R2_SECRET_ACCESS_KEY=%q\n' "${R2_SECRET_ACCESS_KEY:-}"
            printf 'export R2_BUCKET=%q\n' "${R2_BUCKET:-}"
            printf 'export R2_PUBLIC_DOMAIN=%q\n' "${R2_PUBLIC_DOMAIN:-}"
            printf 'export SWAGGER_ENABLED=%q\n' "${SWAGGER_ENABLED:-false}"
            printf 'export SWAGGER_USER=%q\n' "${SWAGGER_USER:-}"
            printf 'export SWAGGER_PASS=%q\n' "${SWAGGER_PASS:-}"
            printf 'export BACKUP_REMOTE_HOST=%q\n' "${BACKUP_REMOTE_HOST:-}"
            printf 'export BACKUP_REMOTE_DIR=%q\n' "${BACKUP_REMOTE_DIR:-}"
            printf 'export BACKUP_REMOTE_KEY=%q\n' "${BACKUP_REMOTE_KEY:-}"
            printf 'export BACKEND_HOST_PORT=%q\n' "${BACKEND_HOST_PORT:-8080}"
            printf 'export PG_VOLUME=%q\n' "${PG_VOLUME:-}"
            printf 'export REDIS_VOLUME=%q\n' "${REDIS_VOLUME:-}"
            printf 'export UPLOADS_VOLUME=%q\n' "${UPLOADS_VOLUME:-}"
            printf 'export REPORTS_VOLUME=%q\n' "${REPORTS_VOLUME:-}"
            printf 'export SKIP_BACKUP=%q\n' "${SKIP_BACKUP:-false}"
            printf 'export COMPOSE_PROFILES=%q\n' "${COMPOSE_PROFILES:-}"
            printf 'export HEALTH_CHECK_RETRIES=%q\n' "${HEALTH_CHECK_RETRIES:-20}"
            printf 'export UP_WAIT_TIMEOUT=%q\n' "${UP_WAIT_TIMEOUT:-60}"
          } > /tmp/deploy-env.sh

          echo "环境变量文件已生成（$(wc -l < /tmp/deploy-env.sh) 行）"
          echo "注意：密钥值已被 GitHub Actions 自动 mask，不会出现在日志中"

          # 上传环境变量文件
          scp -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            /tmp/deploy-env.sh \
            "target:/tmp/deploy-env.sh"

          # 执行远程部署（脚本在 $DEPLOY_PATH/scripts/ 下，tar 打包上传）
          # timeout 兜底：脚本内部命令挂死时 fail-fast（DEPLOY_CMD_TIMEOUT），不再挂到被人工取消
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "target" \
            "set -e; source /tmp/deploy-env.sh; shred -u /tmp/deploy-env.sh 2>/dev/null || rm -f /tmp/deploy-env.sh; cd \"\$DEPLOY_PATH\" && timeout \"\$DEPLOY_CMD_TIMEOUT\" bash scripts/deploy-remote.sh"

      # --------------------------------------------------------
      # Step 2.4: 测试环境部署成功后停止容器（避免空转占用资源）
      #   testing CD 定位为冒烟验证：起栈 → 健康检查 → 立即 down，
      #   环境名取自 gate outputs（push 事件下 inputs.environment 为空）
      # --------------------------------------------------------
      - name: 测试环境停止容器
        if: success() && needs.gate.outputs.environment == 'testing'
        run: |
          echo "测试环境部署成功，停止容器以释放资源..."
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "target" \
            "cd $DEPLOY_PATH && timeout 120 docker compose -f docker-compose.prod.yml down 2>&1 || true"
          echo "✅ 测试环境容器已停止"

      # --------------------------------------------------------
      # Step 2.5: 清理
      # --------------------------------------------------------
      - name: 清理 SSH 密钥
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key /tmp/deploy-env.sh

  # ============================================================
  # Stage 6: 部署汇总
  # ============================================================
  notify:
    needs: [gate, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总部署状态
        run: |
          DEPLOY_STATUS="${{ needs.deploy.result }}"

          echo "# 部署报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 目标环境 | ${{ needs.gate.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 全栈部署 (公网 SSH) | $([ "$DEPLOY_STATUS" = 'success' ] && echo '✅' || ([ "$DEPLOY_STATUS" = 'skipped' ] && echo '⏭️') || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端 | $([ "$DEPLOY_STATUS" = 'success' ] && echo '✅ 已部署' || echo '⚠️') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 后端 API: ${{ vars.API_URL || '未配置' }}" >> $GITHUB_STEP_SUMMARY
          echo "- 前端: ${{ vars.FRONTEND_URL || '未配置' }}" >> $GITHUB_STEP_SUMMARY
        shell: bash

  # 注：生产发布不再有 promote job。旧链路是「master → testing → promote → production」，
  # 现链路是「分支 push → testing 冒烟」+「master 合并 → 直接 production」，
  # production 由 cd.yml 的 push 触发器进入，前置校验见 Stage 0 的 gate job。
