# GitHub Dependabot：依赖侧的安全告警与升级 PR
#
# 分成两层，缺一不可：
#   1. **版本更新**（本文件）——按周/月把依赖升到新版，PR 走既有 ruleset 与 CI；
#   2. **安全更新**（仓库设置里的 Dependabot alerts + security updates）——
#      只针对有 CVE 的版本，触发不受本文件控制，已在 2026-10-22 通过 API 打开。
#
# 刻意不覆盖的两个位置：
# - `training-app/叉车维修培训学员端跨端应用`：移动端由 @zhengcookie 负责，其 PR 要过
#   真机验收门（四门 + 证据），机器开的依赖 PR 到不了那道门，只会变成红单；
# - `unpackage/**`：构建产物（未入库），不是依赖清单。
version: 2

updates:
  # ===== Go 后端 =====
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      go-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  # ===== Web 前端 =====
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    ignore:
      # katex 0.19 装不上：marked-katex-extension@5.1.13（当前最新）的 peer 是 `>=0.16 <0.19`，
      # 升上去 npm ci 直接 ERESOLVE（#1787 里实测过）。上游放宽 peer 后删掉这条；跟踪 #1788。
      - dependency-name: katex
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  # ===== GitHub Actions =====
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - ci

  # ===== 容器基础镜像 =====
  # Go 镜像不许机器人单边升 minor/major：本仓要求「镜像里的 Go = CI 的 GO_VERSION」
  # （见 docs/agents/security-scan.md §2），而升 Go 要同时改 ci.yml / cd.yml / Dockerfile。
  # 补丁版（1.26.10 → 1.26.11 这类安全补丁）仍然自动开 PR。
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Node 大版本跟 LTS 走（当前 24 Krypton），同样由人同步 CI 的 NODE_VERSION 与镜像 tag。
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /libreoffice-sidecar
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - docker
