        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.SubmitResultDTO'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 重做错题
      tags:
      - 学员端-错题本
  /wrong-questions/{question_id}/remove:
    post:
      consumes:
      - application/json
      description: 将指定题目移出错题本
      parameters:
      - description: 题目ID
        in: path
