          description: 已拒绝
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 状态不允许
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
