info:
  contact: {}
  description: '学员端与公开端点：认证/验证码/微信登录/学员学习中心/课程/练习/考试/收藏/搜索/资料/论坛/通知/精选/AI助手/培训目录；鉴权：`Authorization:
    Bearer <access JWT>`（access 2h，`POST /api/auth/refresh` 换新双令牌）。响应统一 `{code,message,data}`（见
    ADR-0005）。不含导师端、管理端与残值评估模块。'
  title: 叉车维修培训系统-学员端 API
  version: "1.0"
paths:
  /admin/forum/replies/{id}:
    delete:
      description: 管理端删除任意回复（若为被采纳回答则按 rollback 对冲回收，封底 0，幂等）
      parameters:
      - description: 回复 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已删除
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 删除失败
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 管理员删除回复
      tags:
      - 管理端-论坛
  /admin/forum/reports/{id}:
    put:
      consumes:
      - application/json
      description: '管理端处理论坛举报（status: 1 标记已处理）'
      parameters:
      - description: 举报 ID
        in: path
        name: id
        required: true
        type: integer
      - description: '处理状态 {status: int16}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 已更新
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 处理论坛举报
      tags:
      - 管理端-论坛
  /admin/forum/topics/{id}:
    delete:
      description: 管理端删除帖子（若曾发分则按 rollback 对冲扣减，封底 0，幂等）
      parameters:
      - description: 主题 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已删除
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 删除失败
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 管理员删除帖子
      tags:
      - 管理端-论坛
    get:
      description: 管理端只读查看帖子详情（含回复）
      parameters:
      - description: 主题 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 详情
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
        "404":
          description: 主题不存在
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 管理员查看帖子
      tags:
      - 管理端-论坛
  /admin/job-reports:
    get:
      description: 管理端查看待处理举报队列
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
