            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 移出错题本
      tags:
      - 学员端-错题本
  /wrong-questions/batch-remove:
    post:
      consumes:
      - application/json
      description: 批量将错题移出（is_removed=true）
      parameters:
      - description: 题目IDs
        in: body
        name: body
        required: true
