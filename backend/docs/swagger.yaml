        description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 开始日期 YYYY-MM-DD
        in: query
        name: start_date
        type: string
      - description: 结束日期 YYYY-MM-DD
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.StudyRecordPageResult'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 学习记录分页
      tags:
      - 学员端-学习中心
  /student/study-stats:
    get:
      consumes:
      - application/json
      description: 按天聚合学习时长，用于仪表盘图表；days 仅支持 7 或 30，其他回退 7
      parameters:
      - default: 7
        description: 统计天数
        enum:
        - 7
        - 30
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.StudyDailyStatsDTO'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 学习统计（按天）
      tags:
      - 学员端-学习中心
  /tags:
    get:
      description: 仅启用项
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
      summary: 题库标签（公开）
      tags:
      - 学员端-培训目录
  /wrong-questions:
    get:
      consumes:
      - application/json
      description: 分页查询错题，支持按题型/错误次数过滤
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 题型
        in: query
        name: type
        type: string
      - description: 最小错误次数
        in: query
        name: min_wrong_count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 错题列表
      tags:
      - 学员端-错题本
  /wrong-questions/{question_id}/redo:
    post:
      consumes:
      - application/json
      description: 提交错题重做答案并判分
      parameters:
      - description: 题目ID
        in: path
        name: question_id
        required: true
        type: integer
      - description: 答案
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 重做错题
      tags:
      - 学员端-错题本
  /wrong-questions/{question_id}/remove:
    post:
      consumes:
      - application/json
      description: 将指定题目移出错题本
      parameters:
      - description: 题目ID
        in: path
        name: question_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 移出错题本
      tags:
      - 学员端-错题本
  /wrong-questions/batch-remove:
    post:
      consumes:
      - application/json
      description: 批量将错题移出（is_removed=true）
      parameters:
      - description: 题目IDs
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 批量移出
      tags:
      - 学员端-错题本
  /wrong-questions/export:
    get:
      description: 导出为纯文本附件（text/plain）
      produces:
      - text/plain
      responses:
        "200":
          description: 错题文本
          schema:
            type: string
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 导出错题本
      tags:
      - 学员端-错题本
  /wrong-questions/stats:
    get:
      consumes:
      - application/json
      description: 汇总错题数量/题型分布等
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.WrongQuestionStatsDTO'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 错题统计
      tags:
      - 学员端-错题本
securityDefinitions:
  BearerAuth:
    description: Bearer <access JWT>，示例：Bearer eyJhbGciOi...
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
