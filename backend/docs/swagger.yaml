    get:
      consumes:
      - application/json
      description: |-
        公开访问，keyword 模糊匹配 course/chapter/question/content/topic（LIKE 元字符按字面处理）；type 缺省返回各分区聚合（courses/chapters/questions/contents/topics），
        指定 type 时返回该类型的分页结果 —— 同一端点两种响应形状（swag 无联合类型表达力，data 取聚合形状；
        分页形状 service.SearchPageDTO 同域生成，前端以联合类型消费）。
        每条结果带命中位置 hit_field（title|body|reply）与命中片段 snippet（源串窗口，投影与高亮由各端自行处理，ADR-0049 决策 6）。
      parameters:
      - description: 关键词
        in: query
        name: keyword
        required: true
        type: string
      - description: 类型 course|chapter|question|content|topic
        in: query
        name: type
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
