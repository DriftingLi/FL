info:
  contact: {}
  description: '学员端与公开端点：认证/验证码/微信登录/学员学习中心/课程/练习/考试/收藏/搜索/资料（课程附件 + 学员投稿）/论坛/通知/精选/AI助手/积分/培训目录；鉴权：`Authorization:
    Bearer <access JWT>`（access 2h，`POST /api/auth/refresh` 换新双令牌）。响应统一 `{code,message,data}`（见
    ADR-0005）。不含导师端、管理端与残值评估模块。'
  title: 叉车维修培训系统-学员端 API
  version: "1.0"
paths:
  /admin/ai-configs:
    get:
      description: 管理员查看全部多 AI 配置（api_key 已脱敏）
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.AIConfigDTO'
                  type: array
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
        "500":
          description: 查询失败
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: AI 配置列表
      tags:
      - 管理端-AI配置
    post:
      consumes:
      - application/json
      description: 管理员新建多 AI 配置（api_key 落库前加密），响应 data 为 null
      parameters:
      - description: 配置请求 {name,api_key,base_url,model,description}
        in: body
