  /wrong-questions/stats:
    get:
      consumes:
      - application/json
      description: 汇总错题数量/题型分布等
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.WrongQuestionStatsDTO'
