  /valuation/evaluations:
    get:
      consumes:
      - application/json
      description: 分页查询评估历史（可按品牌/车型筛选），仅返回当前登录用户的记录。需登录（估值鉴权组）。
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页条数（默认 20，上限 100）
        in: query
        name: page_size
        type: integer
      - description: 品牌筛选
        in: query
        name: brand
        type: string
      - description: 车型筛选
        in: query
        name: vehicle_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/model.EvaluationDetail'
                      type: array
                    page:
                      type: integer
                    page_size:
                      type: integer
                    total:
                      type: integer
                  type: object
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 评估历史列表
      tags:
      - 估值-评估
    post:
      consumes:
      - application/json
      description: 残值计算 + 持久化，返回 ID + 输入参数 + 全部 K 系数 + 残值 + 置信区间 + 维度评分 + 建议。**可选认证**：匿名可提交（user_id
        落 NULL），带 Bearer 则归属当前用户。
      parameters:
      - description: 评估请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.EvaluationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/model.EvaluationResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.R'
      summary: 提交评估
      tags:
      - 估值-评估
  /valuation/evaluations/{id}:
    get:
      consumes:
      - application/json
      description: 查询评估详情（输入参数 + 计算结果 + 时间戳），仅返回属于当前登录用户的记录。需登录（估值鉴权组）。
      parameters:
      - description: 评估记录 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/model.EvaluationDetail'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
        "404":
          description: 评估记录不存在
          schema:
            $ref: '#/definitions/response.R'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 评估详情
      tags:
      - 估值-评估
  /valuation/evaluations/{id}/report:
    get:
      description: 经 storage 代理流式返回评估 PDF（Content-Disposition attachment）；URL 失效时并发安全地再生成。公开端点：无需登录。
      parameters:
      - description: 评估记录 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/pdf
      responses:
        "200":
          description: PDF 二进制流
          schema:
            type: file
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "404":
          description: 评估记录不存在
          schema:
            $ref: '#/definitions/response.R'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.R'
      summary: 下载评估报告
      tags:
      - 估值-报告
    post:
      consumes:
      - application/json
      description: 触发后端生成评估 PDF 报告（落盘 + 回写 report_pdf_path），返回 PDF URL 与大小。公开端点：无需登录。
      parameters:
      - description: 评估记录 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  properties:
                    evaluation_id:
                      type: integer
                    file_size:
                      type: integer
                    pdf_url:
                      type: string
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "404":
          description: 评估记录不存在
          schema:
            $ref: '#/definitions/response.R'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.R'
      summary: 生成评估报告
      tags:
      - 估值-报告
