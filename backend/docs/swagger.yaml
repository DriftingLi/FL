        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 错题统计
      tags:
      - 学员端-错题本
securityDefinitions:
  BearerAuth:
    description: Bearer <access JWT>，示例：Bearer eyJhbGciOi...
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
