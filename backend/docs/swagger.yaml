info:
  contact: {}
  description: '学员端(hrwai_user) 学习/练习/考试/收藏/搜索/资料/论坛等 P0/P1 能力（ADR-0017/0018）。鉴权：`Authorization:
    Bearer <access JWT>`（access 2h，`POST /api/auth/refresh` 换新双令牌）。响应统一 `{code,message,data}`（见
    ADR-0005）。本页由 gin-swagger 生成，范围 B（~30 端点）。'
  title: 叉车维修培训系统-学员端 API
  version: "1.0"
paths:
  /chapter/{chapter_id}/slides:
    get:
      consumes:
      - application/json
      description: 公开访问，返回章节 PPT 转图片后的 slides
      parameters:
      - description: 章节ID
        in: path
        name: chapter_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/forklift-training_pkg_response.R'
            - properties:
                data:
                  $ref: '#/definitions/forklift-training_internal_service.ChapterSlidesDTO'
              type: object
        "404":
          description: 章节不存在
          schema:
            $ref: '#/definitions/forklift-training_pkg_response.R'
      summary: 章节幻灯片
      tags:
      - 学员端-课程
  /chapter/{chapter_id}/slides/regenerate:
    post:
      consumes:
      - application/json
      description: 需登录，触发章节 PPT 重新转 slides（异步）
      parameters:
      - description: 章节ID
        in: path
        name: chapter_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
