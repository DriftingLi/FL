info:
  contact: {}
  description: '学员端与公开端点：认证/验证码/微信登录/学员学习中心/课程/练习/考试/收藏/搜索/资料/论坛/通知/精选/AI助手/培训目录；鉴权：`Authorization:
    Bearer <access JWT>`（access 2h，`POST /api/auth/refresh` 换新双令牌）。响应统一 `{code,message,data}`（见
    ADR-0005）。不含导师端、管理端与残值评估模块。'
  title: 叉车维修培训系统-学员端 API
  version: "1.0"
paths:
  /ai-assistant/chat:
    post:
      consumes:
      - application/json
      description: 可选认证的 SSE 流式响应，不走统一 JSON 信封；事件 message/error/done
      parameters:
      - description: 消息
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
      summary: AI 流式对话（SSE）
      tags:
      - 学员端-AI助手
  /ai-assistant/models:
    get:
      description: 列出管理员配置的 is_active=true 模型
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
      summary: AI 可用模型（公开）
      tags:
      - 学员端-AI助手
  /ai-assistant/sessions:
    get:
      consumes:
      - application/json
      description: 列出登录用户的会话
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: AI 会话列表
      tags:
      - 学员端-AI助手
    post:
      consumes:
      - application/json
      description: 创建新会话
      parameters:
      - description: 标题/模型
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 创建 AI 会话
      tags:
      - 学员端-AI助手
  /ai-assistant/sessions/{id}:
    delete:
      consumes:
      - application/json
      description: 删除会话及其消息
      parameters:
      - description: 会话ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
        "404":
          description: 不存在
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 删除会话
      tags:
      - 学员端-AI助手
  /ai-assistant/sessions/{id}/messages:
    get:
      consumes:
      - application/json
      description: 获取指定会话的消息列表
      parameters:
      - description: 会话ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
        "404":
          description: 不存在
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 会话消息列表
      tags:
      - 学员端-AI助手
  /ai-assistant/sessions/{id}/title:
    patch:
      consumes:
      - application/json
      description: 修改会话标题，非空最多 100 字符
      parameters:
      - description: 会话ID
        in: path
        name: id
        required: true
        type: integer
      - description: 标题
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 重命名会话
      tags:
      - 学员端-AI助手
  /ai-assistant/user-models:
    get:
      consumes:
      - application/json
      description: 列出登录用户自定义模型（api_key 脱敏）
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 用户自定义模型
      tags:
      - 学员端-AI助手
    post:
      consumes:
      - application/json
      description: 创建或更新用户自定义模型
      parameters:
      - description: 模型
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 保存用户自定义模型
      tags:
      - 学员端-AI助手
  /ai-assistant/user-models/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定用户模型
      parameters:
      - description: 模型ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
        "404":
          description: 不存在
          schema:
            $ref: '#/definitions/response.R'
      security:
