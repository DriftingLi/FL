      tags:
      - 学员端-联系方式交换
  /resume/contact-requests/{id}/revoke:
    post:
      description: 学员撤回已同意的授权（status → revoked，实时生效，明文端点随即 403）
      parameters:
      - description: 申请 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已撤回
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 状态不允许
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 撤回授权
      tags:
      - 学员端-联系方式交换
  /resume/image:
    post:
      consumes:
      - multipart/form-data
      description: 上传工作照（file，图片 ≤20MB，≤6 张）
      parameters:
      - description: 工作照
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功 {url}
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 文件错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 上传工作照
      tags:
      - 学员端-简历卡
  /resume/pdf:
    delete:
      description: 学员删除自己简历卡的上传 PDF 附件（resume_file_url 置空）
      produces:
      - application/json
      responses:
        "200":
          description: 已删除
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 删除 PDF 附件
      tags:
      - 学员端-简历卡
    get:
      description: 学员查看自己的打码在线简历（与招聘者所见同一份；本人鉴权；未建简历 404）
      produces:
      - application/pdf
      responses:
        "200":
          description: PDF 字节流
          schema:
            type: string
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
        "404":
          description: 简历不存在
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 我的在线简历 PDF
      tags:
      - 学员端-简历卡
    post:
      consumes:
      - multipart/form-data
      description: 上传简历 PDF（file，仅 PDF ≤50MB）
      parameters:
      - description: PDF 简历
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功 {url}
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 文件错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 上传简历 PDF
      tags:
      - 学员端-简历卡
  /resume/view-stats:
    get:
      description: 学员查看近 7 天查看过自己简历的企业数（按企业去重，仅聚合数，不含企业名）
      produces:
      - application/json
      responses:
        "200":
          description: 聚合数 {count}
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 简历查看留痕
      tags:
      - 学员端-简历卡
  /resume/visibility:
    put:
      consumes:
      - application/json
      description: 学员切换简历 visibility（hidden/open）；visibility 仅管控 L2 被动浏览面，不影响投递
      parameters:
      - description: '可见性 {visibility: hidden|open}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 已切换
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 切换简历公开
      tags:
      - 学员端-简历卡
  /search:
    get:
      consumes:
      - application/json
      description: 公开访问，keyword 模糊匹配 course/question/content/topic，type 可选过滤
      parameters:
      - description: 关键词
        in: query
        name: keyword
        required: true
        type: string
      - description: 类型 course|question|content|topic
        in: query
        name: type
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
      summary: 全局搜索
      tags:
      - 学员端-搜索
  /student/courses:
    get:
      consumes:
      - application/json
      description: 学员已产生学习记录的课程列表（按最后学习时间倒序）+ continue_learning 置顶；包含封面/方向/等级/完成章节/最后位置（ADR-0017）
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.StudentCoursesDTO'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 我的课程
      tags:
      - 学员端-学习中心
  /student/courses/{course_id}:
    get:
      consumes:
      - application/json
      description: 指定课程的学习详情，包含每章进度/播放位置/完成状态（progress>=100 为完成）
      parameters:
      - description: 课程ID
        in: path
        name: course_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.StudentCourseDetailDTO'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
        "404":
          description: 课程不存在
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 单课程学习详情
      tags:
      - 学员端-学习中心
  /student/materials:
    get:
      consumes:
      - application/json
      description: 基于 chapter_file 的聚合视图，支持按 course_id 过滤；与 /student/materials 同数据
      parameters:
      - description: 课程ID
        in: query
        name: course_id
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 学习资料列表
      tags:
      - 学员端-资料
  /student/profile:
    get:
      consumes:
      - application/json
      description: 学员基本信息 + 学习统计 + 课程进度（角色 hrwai_user）
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.StudentProfileDTO'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
        "404":
          description: 学员不存在
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 学员档案
      tags:
      - 学员端-学习中心
  /student/records:
    get:
      consumes:
      - application/json
      description: 按学员维度分页查询学习记录，支持按日期过滤
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 开始日期 YYYY-MM-DD
        in: query
        name: start_date
        type: string
      - description: 结束日期 YYYY-MM-DD
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.StudyRecordPageResult'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 学习记录分页
      tags:
      - 学员端-学习中心
  /student/study-stats:
    get:
      consumes:
      - application/json
      description: 按天聚合学习时长，用于仪表盘图表；days 仅支持 7 或 30，其他回退 7
      parameters:
      - default: 7
        description: 统计天数
        enum:
        - 7
        - 30
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.StudyDailyStatsDTO'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 学习统计（按天）
      tags:
      - 学员端-学习中心
  /tags:
    get:
      description: 仅启用项
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
      summary: 题库标签（公开）
      tags:
      - 学员端-培训目录
  /wrong-questions:
    get:
      consumes:
      - application/json
      description: 分页查询错题，支持按题型/错误次数/收藏过滤与时间排序
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 题型
        in: query
        name: type
        type: string
      - description: 最小错误次数
        in: query
        name: min_wrong_count
        type: integer
      - description: 仅看收藏
        in: query
        name: favorited
        type: boolean
      - default: time_desc
        description: 排序 time_desc/time_asc
        in: query
        name: sort
        type: string
      - description: 目标证件ID（按题目所属证件分区）
        in: query
        name: credential_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 错题列表
      tags:
      - 学员端-错题本
  /wrong-questions/{question_id}/redo:
    post:
      consumes:
      - application/json
      description: 提交错题重做答案并判分
      parameters:
      - description: 题目ID
        in: path
        name: question_id
        required: true
        type: integer
      - description: 答案
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.SubmitResultDTO'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 重做错题
      tags:
      - 学员端-错题本
  /wrong-questions/{question_id}/remove:
    post:
      consumes:
      - application/json
      description: 将指定题目移出错题本
      parameters:
      - description: 题目ID
        in: path
        name: question_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.R'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 移出错题本
      tags:
      - 学员端-错题本
  /wrong-questions/batch-remove:
    post:
      consumes:
      - application/json
      description: 批量将错题移出（is_removed=true）
      parameters:
      - description: 题目IDs
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 批量移出
      tags:
      - 学员端-错题本
  /wrong-questions/export:
    get:
      description: 导出为纯文本附件（text/plain）
      produces:
      - text/plain
      responses:
        "200":
          description: 错题文本
          schema:
            type: string
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 导出错题本
      tags:
      - 学员端-错题本
  /wrong-questions/stats:
    get:
      consumes:
      - application/json
      description: 汇总错题数量/题型分布等
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.WrongQuestionStatsDTO'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 错题统计
      tags:
      - 学员端-错题本
securityDefinitions:
  BearerAuth:
    description: Bearer <access JWT>，示例：Bearer eyJhbGciOi...
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
