  /wrong-questions:
    get:
      consumes:
      - application/json
      description: 分页查询错题，支持按题型/错误次数/收藏过滤与时间排序
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 题型
        in: query
        name: type
        type: string
      - description: 最小错误次数
        in: query
        name: min_wrong_count
        type: integer
      - description: 仅看收藏
        in: query
        name: favorited
        type: boolean
      - default: time_desc
        description: 排序 time_desc/time_asc
        in: query
        name: sort
        type: string
      - description: 目标证件ID（按题目所属证件分区）
        in: query
        name: credential_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.R'
            - properties:
                data:
                  $ref: '#/definitions/service.WrongQuestionPageDTO'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.R'
      security:
      - BearerAuth: []
      summary: 错题列表
      tags:
      - 学员端-错题本
  /wrong-questions/{question_id}/redo:
    post:
      consumes:
      - application/json
