# ===== 系统 nginx 反代配置 =====
# 放到服务器的 /etc/nginx/sites-enabled/ 或 /etc/nginx/conf.d/
# Proxmox 的 nginx 配置在 /etc/nginx/conf.d/pve.conf 中监听 80，需替换或附加
# 生产域 gccsmile.com（子域名 training./valuation./mentor./manage./dify. 走 DNS 泛解析）
# api 子域不使用：API 与前端同域反代（/api/ → 后端，/ → 前端）
#
# 域名策略（与 portal 仓库约定一致）：
#   www.gccsmile.com 主站由官网门户（hrwai-portal, Nuxt）独立部署接管，
#   本配置不再声明 www；根域名 gccsmile.com 一律 301 → www（门户）。
#   其余子域名（training./valuation./mentor./manage.）由下方 default_server 服务 SPA。

# ===== 根域名 → www（门户）301 =====
server {
    listen 80;
    listen [::]:80;

    server_name gccsmile.com;

    return 301 http://www.gccsmile.com$request_uri;
}

# ===== 主服务器（子域名 SPA + API 反代，catch-all default_server） =====
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # API 反代到后端容器
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 静态文件和前端页面反代到前端容器
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查直连后端
    location = /health {
        proxy_pass http://127.0.0.1:8080/api/health;
        access_log off;
    }
}
