# ===== 系统 nginx 反代配置 =====
# ⚠️ 旧方案（PVE 宿主 nginx）：当前 production/testing 均运行在 LXC + host 网络模式，
#    由 frontend/nginx-host.conf（80/443 + SSL）直接提供服务，本文件不再被部署流水线使用。
#    若未来改由 PVE 宿主 nginx 入口，需自行补充 443 ssl 监听 + 证书（SSL_FULLCHAIN/SSL_PRIVKEY 同源）。
# 放到服务器的 /etc/nginx/sites-enabled/ 或 /etc/nginx/conf.d/
# Proxmox 的 nginx 配置在 /etc/nginx/conf.d/pve.conf 中监听 80，需替换或附加
# 生产域 gccsmile.com（子域名 training./valuation./mentor./manage./dify. 走 DNS 泛解析）
# api 子域不使用：API 与前端同域反代（/api/ → 后端，/ → 前端）
#
# 域名策略（与 portal 仓库约定一致）：
#   www.gccsmile.com 主站由官网门户（hrwai-portal, Nuxt）独立部署接管：
#   - 实际部署环境（LXC + host 网络模式）的 frontend nginx 模板（frontend/nginx-host.conf）
#     已含 www.${DOMAIN} → 门户（127.0.0.1:${PORTAL_HOST_PORT}）的显式转发块，
#     防止 www 落入 default_server 被 SPA（training 应用）接管；
#   - 本模板若部署在 PVE 宿主 nginx，default_server 会捕获 www 以外的请求，
#     www 应显式转发到 frontend（或门户），不要依赖 default_server。
#   根域名 gccsmile.com 一律 301 → www（门户）。
#   其余子域名（training./valuation./mentor./manage.）由下方 default_server 服务 SPA。

# ===== 根域名 → www（门户）301 =====
server {
    listen 80;
    listen [::]:80;

    server_name gccsmile.com;

    return 301 http://www.gccsmile.com$request_uri;
}

# ===== 主服务器（子域名 SPA + API 反代，catch-all default_server） =====
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # API 反代到后端容器
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 静态文件和前端页面反代到前端容器
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查直连后端
    location = /health {
        proxy_pass http://127.0.0.1:8080/api/health;
        access_log off;
    }
}
