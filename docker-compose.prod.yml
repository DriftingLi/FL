# ===== 生产环境 Docker Compose 编排 =====
# 架构：PostgreSQL + Go 后端 + Nginx 前端（全栈 Docker 部署）
# 前端容器兼任 SSL 终止 + API 反代 + 静态文件托管
# 使用：docker compose -f docker-compose.prod.yml up -d
# 前置：确保 .env 已正确配置

services:
  # ==========================================
  # PostgreSQL 数据库
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: forklift-pg-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: forklift_training
      POSTGRES_USER: ${DB_USER:-forklift}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    # PVE 宿主机 AppArmor 的 docker-default profile 会拒绝容器内创建
    # Unix socket（postgres 报 "could not create any Unix-domain sockets"
    # 循环重启），直接跑在 PVE 宿主机 Docker 上时必须解除 AppArmor 限制
    security_opt:
      - apparmor=unconfined
    # 仅内网可访问，不对外暴露端口（仅 backend 容器通过 Docker 网络访问）
    expose:
      - "5432"
    volumes:
      # 默认 named volume；可经 PG_VOLUME 环境变量覆盖为 bind mount 路径
      - ${PG_VOLUME:-pgdata-prod}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-forklift} -d forklift_training"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - forklift-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================
  # Redis 缓存（纯缓存定位：禁用持久化，LRU 淘汰）
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: forklift-redis-prod
    restart: unless-stopped
    # REDIS_PASSWORD 为空时不启用 requirepass（Redis 仅在内网 Docker 网络访问，不暴露端口）
    # 使用 shell 形式以便用参数扩展处理可选密码
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 200mb --maxmemory-policy allkeys-lru --save "" --appendonly no --timeout 300 --tcp-keepalive 60
      else
        exec redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save "" --appendonly no --timeout 300 --tcp-keepalive 60
      fi
      '
    # 不暴露到宿主机，仅 Docker 内部网络访问
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      # 默认 named volume；可经 REDIS_VOLUME 环境变量覆盖为 bind mount 路径
      - ${REDIS_VOLUME:-redisdata-prod}:/data
    healthcheck:
      # 密码为空时 redis-cli ping；非空时 redis-cli -a <password> ping
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - forklift-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================
  # LibreOffice Sidecar 服务（PPT → PDF → PNG 转换）
  # 通过 HTTP multipart API 提供转换能力，无需共享 volume
  # 拆分自 backend 容器，使 backend 镜像从 ~500MB 减小到 ~50MB
  # ==========================================
  libreoffice:
    build:
      context: ./libreoffice-sidecar
      dockerfile: Dockerfile
    image: ${LIBREOFFICE_IMAGE:-forklift-libreoffice:latest}
    container_name: forklift-libreoffice-prod
    restart: unless-stopped
    # profile "full"：默认不启用（testing 部署无需 500MB 大镜像，提速）；
    # production 部署时 COMPOSE_PROFILES=full 才会拉起本服务
    profiles: ["full"]
    expose:
      - "8000"
    networks:
      - forklift-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================
  # Go 后端服务（仅内网可访问，通过前端 Nginx 反代）
  # PPT 转图片功能由 libreoffice sidecar 容器提供
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-forklift-backend:latest}
    container_name: forklift-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # libreoffice 依赖已移除：服务 profile 化后未启用时会报
      # "depends on disabled profile service"；sidecar 是独立 HTTP 服务，
      # 后端按需调用（转换失败不影响主流程），启动顺序无强依赖。
      # production 经 COMPOSE_PROFILES=full 启用 libreoffice。
    environment:
      APP_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://${DB_USER:-forklift}:${DB_PASSWORD}@postgres:5432/forklift_training?sslmode=disable
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRES_HOURS: "${JWT_EXPIRES_HOURS:-2}"
      JWT_REFRESH_EXPIRES_DAYS: "${JWT_REFRESH_EXPIRES_DAYS:-7}"
      # 登录态 Cookie（父域名共享登录）
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-hrwai_token}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      # CORS：必须包含主域名 + 五个子域名（training/valuation/mentor/manage/recruit，逗号分隔）
      # 例：https://www.example.com,https://training.example.com,https://valuation.example.com,https://mentor.example.com,https://manage.example.com,https://recruit.example.com
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOAD_FOLDER: /data/uploads
      VOLUME_MOUNT_PATH: /data
      MAX_CONTENT_LENGTH_MB: "250"
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      TUTOR_DEFAULT_PASSWORD: ${TUTOR_DEFAULT_PASSWORD}
      STUDENT_DEFAULT_PASSWORD: ${STUDENT_DEFAULT_PASSWORD}
      # SMTP 邮件（验证码通道；腾讯企业邮 SSL 465）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USERNAME: ${SMTP_USERNAME:-${SMTP_FROM:-}}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-和润天下}
      # 腾讯云短信（手机验证码通道；SecretId/SecretKey 为云 API 密钥 cam/capi，非控制台 AppKey）
      TENCENT_SMS_SECRET_ID: ${TENCENT_SMS_SECRET_ID:-}
      TENCENT_SMS_SECRET_KEY: ${TENCENT_SMS_SECRET_KEY:-}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID:-}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-}
      TENCENT_SMS_TEMPLATE_REGISTER: ${TENCENT_SMS_TEMPLATE_REGISTER:-}
      TENCENT_SMS_TEMPLATE_LOGIN: ${TENCENT_SMS_TEMPLATE_LOGIN:-}
      TENCENT_SMS_TEMPLATE_PASSWORD: ${TENCENT_SMS_TEMPLATE_PASSWORD:-}
      TENCENT_SMS_TEMPLATE_BIND_PHONE: ${TENCENT_SMS_TEMPLATE_BIND_PHONE:-}
      TENCENT_SMS_REGION: ${TENCENT_SMS_REGION:-ap-guangzhou}
      # 微信登录凭证（小程序与开放平台严格区分，勿混用）
      WECHAT_MINI_PROGRAM_APP_ID: ${WECHAT_MINI_PROGRAM_APP_ID:-}
      WECHAT_MINI_PROGRAM_APP_SECRET: ${WECHAT_MINI_PROGRAM_APP_SECRET:-}
      WECHAT_OPEN_PLATFORM_APP_ID: ${WECHAT_OPEN_PLATFORM_APP_ID:-}
      WECHAT_OPEN_PLATFORM_APP_SECRET: ${WECHAT_OPEN_PLATFORM_APP_SECRET:-}
      VALUATION_PDF_OUTPUT_DIR: /data/reports
      # 统一系统运行日志（zap）：生产写文件到 /data/logs（lumberjack 轮转+压缩+保留），stdout 兜底
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "${LOG_FORMAT:-console}"
      LOG_DIR: ${LOG_DIR:-/data/logs}
      LOG_MAX_SIZE_MB: "${LOG_MAX_SIZE_MB:-100}"
      LOG_MAX_BACKUPS: "${LOG_MAX_BACKUPS:-7}"
      LOG_MAX_AGE_DAYS: "${LOG_MAX_AGE_DAYS:-30}"
      LOG_COMPRESS: "${LOG_COMPRESS:-true}"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_POOL_SIZE: "${REDIS_POOL_SIZE:-20}"
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-fl:}"
      # LibreOffice sidecar HTTP 地址(容器内服务名 + 端口)
      LIBREOFFICE_SIDECAR_URL: http://libreoffice:8000
      # 文件存储：local=本地磁盘 / r2=S3 兼容对象存储（Cloudflare R2 或自建 RGW）
      # r2 模式下上传文件、PDF 报告、PPT 转图片均存到 bucket，本地 /data/uploads 与 /data/reports 仅用于 fallback
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      # 绑定到 R2 bucket 的自定义域名（如 https://cdn.example.com），尾部斜杠会被去除
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:-}
      # Swagger 文档（C 方案：旗标 + BasicAuth；prod 默认 false，临时开启需同时注入 USER/PASS）
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SWAGGER_USER: ${SWAGGER_USER:-}
      SWAGGER_PASS: ${SWAGGER_PASS:-}
      TZ: Asia/Shanghai
    # 端口映射到宿主机回环，供 host 模式的 frontend nginx 反代访问
    # PVE 环境：frontend 用 network_mode: host，需通过 127.0.0.1:${BACKEND_HOST_PORT} 访问 backend
    # 默认 8080；testing 环境经 BACKEND_HOST_PORT 环境变量固定为 18080
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      # 默认 named volume；可经 UPLOADS_VOLUME/REPORTS_VOLUME 环境变量覆盖为 bind mount 路径
      - ${UPLOADS_VOLUME:-uploads-data}:/data/uploads
      - ${REPORTS_VOLUME:-reports-data}:/data/reports
      # 日志卷：应用内 lumberjack 轮转持久化（可经 LOGS_VOLUME 覆盖为 bind mount 路径）
      - ${LOGS_VOLUME:-logs-data}:/data/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - forklift-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
        reservations:
          memory: 384M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ==========================================
  # Nginx 前端服务（SSL 终止 + API 反代 + 静态文件托管）
  # ==========================================
  frontend:
    image: ${FRONTEND_IMAGE:-forklift-frontend:latest}
    container_name: forklift-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # PVE 环境用 host 网络模式，绕过 Docker 网桥 iptables FORWARD policy DROP 拦截
    # nginx 直接监听宿主机 80/443 端口（80 统一 301 → HTTPS），proxy_pass 到 127.0.0.1:8080 访问 backend
    # 说明：镜像 master 以 root 运行以绑定 80/443（host 网络模式下 --cap-add 对非 root 不生效），
    #       worker 由 nginx.conf 的 user nginx; 自动降权
    network_mode: host
    # PVE 宿主机 AppArmor 的 docker-default profile 会拒绝 nginx master 创建
    # socketpair（worker 进程无法与 master 通信，日志报 "socketpair() failed
    # (13: Permission denied)"，对外 80/443 无响应），必须解除 AppArmor 限制
    security_opt:
      - apparmor=unconfined
    # healthcheck 保持禁用：host 网络模式下容器内没有独立网络命名空间，
    # 真实探活由 deploy-remote.sh 在宿主机侧执行（HTTPS 443 /health，PR #483）。
    # 历史注：早期「host 网络下 wget 行为异常导致误报 unhealthy」的归因有误——
    # 真实原因是 80 端口 server 级 return 301 抢在 location 匹配前执行（issue #496），
    # /health 实际返回 301，wget 跟随重定向后因证书不匹配而失败。
    healthcheck:
      disable: true
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # backend 宿主机映射端口（默认 8080；testing 环境固定 18080）
      BACKEND_HOST_PORT: ${BACKEND_HOST_PORT:-8080}
      # 官网门户（hrwai-portal）宿主机监听端口（默认 3000）
      PORTAL_HOST_PORT: ${PORTAL_HOST_PORT:-3000}
    volumes:
      # host 模式专用 nginx 配置（listen 80/443 + proxy_pass 127.0.0.1:8080）
      - ./frontend/nginx-host.conf:/etc/nginx/conf.d/default.conf.template:ro
      # SSL 证书：CD 流水线（write_ssl_certs）写入 ${DEPLOY_PATH}/nginx/ssl，
      # 挂载到容器 /etc/nginx/ssl（nginx-host.conf 引用固定路径）
      - ${SSL_CERT_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
      # AI 智能维修助手前端静态包（交付包 assistant-dist，运维解压至
      # ${DEPLOY_PATH}/nginx/assistant-dist；缺失时目录为空、子域 404，不影响其他站点）
      - ./nginx/assistant-dist:/usr/share/nginx/assistant:ro
      # 上述子域运维接口（docs/kb/fault-codes）的 Basic Auth 凭据（运维维护）
      - ./nginx/.htpasswd-assistant:/etc/nginx/.htpasswd-assistant:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  forklift-net:
    driver: bridge

volumes:
  pgdata-prod:
    driver: local
  redisdata-prod:
    driver: local
  uploads-data:
    driver: local
  reports-data:
    driver: local
  logs-data:
    driver: local
